# krateo-blueprints/charts PUBLISHING.md rule 9: the index publisher is pinned by full commit SHA (it
# receives CHARTS_PUBLISH_TOKEN, an org-wide write token, so a movable ref would let whoever moves it run
# code with that token here). Dependabot is what keeps a SHA pin current: a new publisher release
# arrives as a reviewed pull request instead of silently.
#
# The github-actions ecosystem also covers the actions/* refs in every workflow. The shared
# krateo-platformops/.github reusables and the krateo-blueprints/charts pinned-uses check are pinned by SHA
# with their release tag in the trailing comment (`# 1.0.0`, `# 1.4.2`), so Dependabot advances them as
# reviewed pull requests too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
