# krateo-blueprints/charts PUBLISHING.md rule 9: the index publisher is pinned by full commit SHA (it
# receives CHARTS_PUBLISH_TOKEN, an org-wide write token, so a movable ref would let whoever moves it run
# code with that token here). Dependabot is what keeps a SHA pin current: a new publisher release
# arrives as a reviewed pull request instead of silently.
#
# The github-actions ecosystem also covers the actions/* refs in every workflow. The shared
# krateo-platformops/.github reusables and the krateo-blueprints/charts pinned-uses check are pinned by SHA
# with their release tag in the trailing comment (`# X.Y.Z`), so Dependabot advances them as
# reviewed pull requests too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # One pull request per shared repository, so our direct pins of a shared repo never sit at two commits (a shared
    # internal script would then run at two versions). Dependabot names a reusable-workflow dependency
    # `owner/repo/.github/workflows/file`, not `owner/repo`: this repository's own history has
    # "bump krateo-blueprints/charts/.github/workflows/publish-chart.yaml from 1.0.3 to 1.0.4". Group
    # patterns use `*` as a wildcard, and dependabot-core's WildcardMatcher turns it into `.*`, which
    # matches `/` (common/lib/wildcard_matcher.rb), so `owner/repo/*` covers every workflow file of that repo.
    groups:
      krateo-platformops-dotgithub:
        patterns:
          - "krateo-platformops/.github/*"
      krateo-blueprints-charts:
        patterns:
          - "krateo-blueprints/charts/*"
