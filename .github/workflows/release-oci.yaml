# Publishes this repo's two Helm charts (github-provider-kog, github-provider-kog-config) on a release
# tag, through the org-wide reusable release-oci, which does all of it in one call (krateo-blueprints/charts
# repository standard R5):
#   - before anything is pushed: the chart-referenced image gate (none here), the org's release-preflight
#     (PUBLISHING.md rules 12 and 13: a plain X.Y.Z), the index-preflight (CHARTS_PUBLISH_TOKEN present and
#     free of whitespace, value never printed), and the index's own content gate on every package;
#   - the push to GHCR, which REFUSES to replace a published version whose contents differ and skips one
#     whose contents are identical, and stamps OCI provenance annotations;
#   - the index: it pulls each chart back from GHCR, so the index stores the registry's exact bytes
#     (rule 1), and calls the org's one publisher, publish-chart.
#
# This file supplies the triggers, our OCI path, the channel and two checks the shared workflow does not
# make: the commit being released passed lint (rule 10), and the packages are exactly our two charts.
#
# oci_repo is set explicitly: the shared default is krateo-platformops/charts, and this repository has
# always published to krateo-blueprints/charts. secrets.GITHUB_TOKEN is implicit and caller-scoped;
# `secrets: inherit` would not work cross-org and is not used.
#
# CHANNEL: `operators` for both charts. Neither ships a CompositionDefinition (PUBLISHING.md rule 2), and
# the publisher refuses a non-blueprint in `blueprints`.
#
# A MANUAL RUN IS A REHEARSAL BY DEFAULT. workflow_dispatch's dry_run defaults to true and is passed as
# `github.event_name == 'workflow_dispatch' && inputs.dry_run`, so a tag push always publishes and a
# dispatch publishes only when someone sets dry_run=false on purpose. A dry run builds and checks
# everything and pushes nothing. A dispatch's ref is a branch, which release-preflight refuses as a
# version, so a dispatch needs chart_version.
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (plain X.Y.Z). Required on a dispatch: the ref is a branch, not a tag."
        required: true
      dry_run:
        description: "Build and check everything, push nothing. Set false only to publish from a dispatch."
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # The version this release carries, and rule 10. release-oci `needs:` this job, so a refusal here stops
  # the release before GHCR holds anything.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read # list this repo's lint runs
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # chart_version on a dispatch, else the tag. It is not checked here: release-oci's release-preflight
      # checks it against PUBLISHING.md rule 13 with the same definition publish-chart uses at index time.
      - name: Resolve the chart version
        id: version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-$REF_NAME}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release version $v"

      # PUBLISHING.md rule 10. This asserts only what it can see: that THIS commit has a concluded,
      # successful run of lint.yaml (which runs on every push to main and on every pull request). A squash
      # merge's history does not record what ran against the branch, so no claim is made about that.
      - name: The commit being released must have passed lint
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="repos/${REPO}/actions/workflows/lint.yaml/runs?head_sha=${SHA}&per_page=100"
          done_n=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status == "completed")] | length')
          ok_n=$(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          echo "lint runs on ${SHA}: ${done_n} completed, ${ok_n} successful"
          if [ "$done_n" -eq 0 ]; then
            echo "::error::No lint run exists for ${SHA}: no gate saw this commit. Dispatch lint.yaml on it, confirm it passes, then re-tag."
            exit 1
          fi
          if [ "$ok_n" -eq 0 ]; then
            echo "::error::lint ran on ${SHA} but never succeeded. Refusing to publish."
            exit 1
          fi

  release-oci:
    needs: preflight
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@aa90d48e1a101d5e9b3e547bca116b97c49513b5 # 2.1.0
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_version || '' }}
      oci_repo: oci://ghcr.io/krateo-blueprints/charts
      index_channel: operators
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      charts_publish_token: ${{ secrets.CHARTS_PUBLISH_TOKEN }}

  # release-oci discovers what to publish from the repository layout and checks the index against the
  # set it discovered, so a chart that discovery missed would be missing from both and nothing would
  # fail. This names the set: the packages it built (the release-oci-charts artifact, uploaded in a dry
  # run too) must be exactly our two charts, each carrying its own name and the release version as both
  # version and appVersion. In a real release this runs after the push, so it reports a wrong set rather
  # than preventing it; the dry run that rehearses a workflow change is where it prevents one.
  packages-are-our-two-charts:
    needs: [preflight, release-oci]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: azure/setup-helm@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-oci-charts
          path: built
      - name: The packages are exactly github-provider-kog and github-provider-kog-config at this version
        run: |
          set -euo pipefail
          want="github-provider-kog-${VERSION}.tgz github-provider-kog-config-${VERSION}.tgz"
          got="$(find built -maxdepth 1 -type f -name '*.tgz' -exec basename {} \; | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$got" != "$want" ]; then
            echo "::error::release-oci built '${got}', expected exactly '${want}'"
            exit 1
          fi
          for name in github-provider-kog github-provider-kog-config; do
            meta="$(helm show chart "built/${name}-${VERSION}.tgz")"
            n="$(sed -n 's/^name: //p' <<< "$meta")"; v="$(sed -n 's/^version: //p' <<< "$meta")"
            a="$(sed -n 's/^appVersion: //p' <<< "$meta" | tr -d '"')"
            if [ "$n" != "$name" ] || [ "$v" != "$VERSION" ] || [ "$a" != "$VERSION" ]; then
              echo "::error::${name}-${VERSION}.tgz declares name '${n}' version '${v}' appVersion '${a}'"
              exit 1
            fi
            echo "${name} ${VERSION} ok (appVersion ${a})"
          done
