name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  # Two fixes in this chart are ABSENCES — a field removed from an update body so drift can no
  # longer act on it (0.2.2 `name`, 0.3.1 `private`/`visibility`). Nothing in the generated CRD
  # records that, and re-adding one is silent: no error, no failure, just a controller that starts
  # renaming or re-exposing live repositories again. This job is the only thing that notices.
  drift-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 hack/assert-drift-invariants.py .

  # `kinds` selects what renders, and the names in the guards and the schema enum are connected only
  # by this check. A wrong name renders half a kind, and helm says nothing.
  kinds-selectable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 hack/assert-kinds.py .

  # config-chart/ renders kinds that exist only because oasgen generates them from chart/. The two
  # charts share no code, so only this check notices when they stop agreeing.
  config-chart-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 hack/assert-config-chart.py .

  # A status field is filled from the get (or findby) response, so a path that response schema does
  # not have stays empty forever while the resource reports Ready. Only this check notices.
  status-fields-in-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 hack/assert-status-fields.py .

  oas-adherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 hack/assert-oas-adherence.py .
