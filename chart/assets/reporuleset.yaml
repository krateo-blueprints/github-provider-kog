openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - Repository Rulesets
servers:
  - url: https://api.github.com
paths:
  "/repos/{owner}/{repo}/rulesets":
    post:
      summary: Create a repository ruleset
      operationId: repos/create-repo-ruleset
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - enforcement
              properties:
                name:
                  type: string
                target:
                  type: string
                  enum:
                    - branch
                    - tag
                    - push
                  default: branch
                # `evaluate` (dry-run) is GitHub Enterprise only; elsewhere GitHub 422s.
                enforcement:
                  type: string
                  enum:
                    - disabled
                    - active
                    - evaluate
                bypass_actors:
                  type: array
                  items:
                    $ref: '#/components/schemas/BypassActor'
                conditions:
                  $ref: '#/components/schemas/Conditions'
                rules:
                  $ref: '#/components/schemas/Rules'
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
  # ruleset_id is assigned by GitHub on create. It is excluded from the spec and bound from
  # status.id by requestFieldMapping (see rd-reporuleset.yaml).
  #
  # The upstream GET also takes an `includes_parents` query parameter (default true), which
  # widens the lookup to org- and enterprise-level rulesets. It is NOT modelled: this CR only
  # ever addresses the id it created itself, and leaving the parameter out keeps a field off
  # the CRD that could only ever make the observe read someone else's ruleset.
  "/repos/{owner}/{repo}/rulesets/{ruleset_id}":
    get:
      summary: Get a repository ruleset
      operationId: repos/get-repo-ruleset
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ruleset_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
    put:
      summary: Update a repository ruleset
      operationId: repos/update-repo-ruleset
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ruleset_id'
      # The SAME property set as create, with nothing required — GitHub keeps whatever the body
      # omits. Every create field is therefore updatable and this resource has no create-only
      # field, which is what makes compareScope: updatable a pure tightening here rather than a
      # rescue (see rd-reporuleset.yaml).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                target:
                  type: string
                  enum:
                    - branch
                    - tag
                    - push
                enforcement:
                  type: string
                  enum:
                    - disabled
                    - active
                    - evaluate
                bypass_actors:
                  type: array
                  items:
                    $ref: '#/components/schemas/BypassActor'
                conditions:
                  $ref: '#/components/schemas/Conditions'
                rules:
                  $ref: '#/components/schemas/Rules'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
    delete:
      summary: Delete a repository ruleset
      operationId: repos/delete-repo-ruleset
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ruleset_id'
      responses:
        '204':
          description: Response
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    ruleset_id:
      name: ruleset_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    # bypass_actors, conditions and rules are $ref'd rather than inlined twice: create and
    # update take the identical structures, and `rules` alone is ~70 lines.
    BypassActor:
      type: object
      required:
        - actor_type
      properties:
        # Numeric id of the team / user / app / repository role. Omit it entirely for
        # OrganizationAdmin and DeployKey, which take no id.
        actor_id:
          type: integer
        actor_type:
          type: string
          enum:
            - Integration
            - OrganizationAdmin
            - RepositoryRole
            - Team
            - DeployKey
            - User
        bypass_mode:
          type: string
          enum:
            - always
            - pull_request
            - exempt
          default: always
    # A repository-level ruleset conditions on refs only — the repository is already fixed by
    # the path. (The org-level equivalent adds repository_name; see assets/orgruleset.yaml.)
    Conditions:
      type: object
      properties:
        ref_name:
          type: object
          properties:
            # `~DEFAULT_BRANCH` and `~ALL` are the two magic values; anything else is an fnmatch
            # pattern over full ref names (refs/heads/...).
            include:
              type: array
              items:
                type: string
            exclude:
              type: array
              items:
                type: string
    # THE HARD TRIM. Upstream, `rules` is an array whose items are a oneOf of 23 rule variants,
    # each with its own `parameters` object. Two things make that unusable verbatim:
    #
    #   1. oasgen-provider has no oneOf/anyOf handling at all (only allOf is merged), so a oneOf
    #      item schema reaches the generated CRD with no usable shape.
    #   2. Even flattened, several variants nest further unions — pull_request's
    #      `dismissal_restriction.allowed_actors` and `required_reviewers[].reviewer` are both
    #      actor unions of their own.
    #
    # So an item here is a flat {type, parameters} pair, and `parameters` is the UNION of the
    # parameter sets of the rule types below, every key optional. Which keys are legal depends on
    # `type`; GitHub 422s on a mismatch rather than ignoring it, which is the correct and loud
    # failure. Set only the keys belonging to the type you chose.
    #
    # "every key optional" is a property of THIS union, not of GitHub. Flattening the oneOf drops
    # each variant's own `required` list, so the CRD cannot enforce it: a PARTIAL `parameters`
    # object passes admission and is then rejected by the API. Once `parameters` is present, send
    # the complete set for that type —
    #   pull_request           required_approving_review_count, dismiss_stale_reviews_on_push,
    #                          require_code_owner_review, require_last_push_approval,
    #                          required_review_thread_resolution  (all five; allowed_merge_methods
    #                          is the only optional extra)
    #   required_status_checks required_status_checks, strict_required_status_checks_policy
    #                          (do_not_enforce_on_create is optional)
    #   update                 update_allows_fetch_and_merge
    #   required_deployments   required_deployment_environments
    #   merge_queue            check_response_timeout_minutes, grouping_strategy,
    #                          max_entries_to_build, max_entries_to_merge, merge_method,
    #                          min_entries_to_merge, min_entries_to_merge_wait_minutes (all seven;
    #                          GitHub requires the whole set together)
    #   *_pattern (the five)   operator, pattern (required pair); name, negate (optional)
    # The parameterless types — creation, deletion, non_fast_forward, required_linear_history,
    # required_signatures — take no `parameters` key at all.
    #
    # MODELLED (the declarative set a platform team actually writes):
    #   creation, deletion, update, non_fast_forward, required_linear_history,
    #   required_signatures, pull_request, required_status_checks, required_deployments,
    #   merge_queue, commit_message_pattern, commit_author_email_pattern,
    #   committer_email_pattern, branch_name_pattern, tag_name_pattern.
    #
    # On the five *_pattern rules, and the "name/pattern would collide" note this comment used to
    # carry: there is NO collision, and it was removed after checking the generator source. Those
    # keys live at rules[].parameters.{name,pattern} — two levels below the ruleset's own
    # top-level `name` — and oasgen's ONLY name-merge logic (addParametersToSpec, #108/#257)
    # reconciles a ROOT-level body property against a path/query/header PARAMETER of the same
    # name; it never walks nested body keys and never merges body-to-body. A property literally
    # named `pattern` is read from the `properties` map by its key and is a different thing from
    # the `pattern` validation keyword (libopenapi_adapter populates Properties and Pattern from
    # separate inputs). Verified against oasgen 0.43.0 (what clusters run) and current, and by
    # generating the CRD and validating sample CRs. So the five pattern rules and merge_queue are
    # modelled as plain additional optional keys in the same union.
    #
    # LEFT OUT, and why:
    #   workflows, code_scanning,       — reference other GitHub products by identifiers this
    #   license_compliance_scanning,      provider cannot resolve (Actions workflow files keyed by
    #   copilot_code_review               repository_id + path, code-scanning tool names, Copilot).
    #                                     Hand-copying a repository_id into a CR is the wrong
    #                                     shape for a KOG kind.
    #   file_path_restriction,          — push-target rules (target: push), GitHub Enterprise
    #   max_file_path_length,             Cloud only. Out of scope for a provider that must work
    #   file_extension_restriction,       on any plan.
    #   max_file_size
    #
    #   pull_request.dismissal_restriction and pull_request.required_reviewers are dropped for
    #   reason (2) above; required_reviewers is additionally still in beta upstream.
    Rules:
      type: array
      items:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - creation
              - update
              - deletion
              - non_fast_forward
              - required_linear_history
              - required_signatures
              - pull_request
              - required_status_checks
              - required_deployments
              - merge_queue
              - commit_message_pattern
              - commit_author_email_pattern
              - committer_email_pattern
              - branch_name_pattern
              - tag_name_pattern
          parameters:
            type: object
            properties:
              # type: update
              update_allows_fetch_and_merge:
                type: boolean
              # type: pull_request
              required_approving_review_count:
                type: integer
              dismiss_stale_reviews_on_push:
                type: boolean
              require_code_owner_review:
                type: boolean
              require_last_push_approval:
                type: boolean
              required_review_thread_resolution:
                type: boolean
              allowed_merge_methods:
                type: array
                items:
                  type: string
                  enum:
                    - merge
                    - squash
                    - rebase
              # type: required_status_checks
              strict_required_status_checks_policy:
                type: boolean
              do_not_enforce_on_create:
                type: boolean
              required_status_checks:
                type: array
                items:
                  type: object
                  required:
                    - context
                  properties:
                    # The check's name as it appears on a commit, e.g. "security / sbom".
                    context:
                      type: string
                    integration_id:
                      type: integer
              # type: required_deployments
              required_deployment_environments:
                type: array
                items:
                  type: string
              # type: merge_queue — all seven keys are required together by GitHub; the flattened
              # union cannot enforce that, so a partial set is a 422 (loud), not a silent ignore.
              # GitHub also range-checks the integers (timeouts 1-360 / 0-360, entry counts 0-100);
              # those bounds are left to the API rather than duplicated as CRD constraints.
              # CONSTRAINT (verified live 2026-11-03): a ruleset carrying a merge_queue rule must
              # target a CONCRETE ref — its conditions.ref_name must NOT be a wildcard such as ~ALL,
              # or GitHub 422s "Wildcard ref names are not supported when merge queue is enabled".
              # Use refs/heads/<branch> or ~DEFAULT_BRANCH.
              check_response_timeout_minutes:
                type: integer
                description: >-
                  merge_queue parameter. All seven merge_queue keys are required together.
                  A ruleset carrying a merge_queue rule must target a concrete ref: its
                  conditions.ref_name must not be a wildcard such as ~ALL (GitHub returns 422
                  "Wildcard ref names are not supported when merge queue is enabled"). Use
                  refs/heads/<branch> or ~DEFAULT_BRANCH.
              grouping_strategy:
                type: string
                enum:
                  - ALLGREEN
                  - HEADGREEN
              max_entries_to_build:
                type: integer
              max_entries_to_merge:
                type: integer
              merge_method:
                type: string
                enum:
                  - MERGE
                  - SQUASH
                  - REBASE
              min_entries_to_merge:
                type: integer
              min_entries_to_merge_wait_minutes:
                type: integer
              # types: commit_message_pattern, commit_author_email_pattern,
              # committer_email_pattern, branch_name_pattern, tag_name_pattern — the five share one
              # {name, negate, operator, pattern} shape. `operator` and `pattern` are the required
              # pair; `name` (a human label for the rule) and `negate` are optional. `name` here is
              # the pattern rule's own label at rules[].parameters.name — NOT the ruleset's
              # top-level `name`, and it cannot collide with it (see the comment above).
              name:
                type: string
              negate:
                type: boolean
              operator:
                type: string
                enum:
                  - starts_with
                  - ends_with
                  - contains
                  - regex
              pattern:
                type: string
    # Response schema. It carries the fields the status is built from and nothing else: drift
    # comparison reads the LIVE response body, never this schema, so `rules`, `conditions` and
    # `bypass_actors` need no response-side declaration and are not duplicated here.
    Ruleset:
      type: object
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        target:
          type: string
          # `repository` is response-only: GitHub returns it for repository-policy rulesets but
          # does not accept it on the request side. It MUST be listed here — status.target takes
          # its schema from this property, and an enum that cannot hold what GitHub returns
          # would make the status write fail.
          enum:
            - branch
            - tag
            - push
            - repository
        # Repository / Organization / Enterprise — at which level the ruleset is defined. Worth
        # surfacing because /repos/.../rulesets also reports inherited org rulesets.
        source_type:
          type: string
          enum:
            - Repository
            - Organization
            - Enterprise
        source:
          type: string
        enforcement:
          type: string
          enum:
            - disabled
            - active
            - evaluate
        created_at:
          type: string
        updated_at:
          type: string
security:
  - accessToken: []
