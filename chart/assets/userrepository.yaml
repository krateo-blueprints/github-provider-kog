openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - User Repositories
servers:
  - url: https://api.github.com
paths:
  # The authenticated user's own repositories. This kind has NO hand-set owner: GitHub decides the
  # owner of a POST /user/repos from the TOKEN, so a CR-supplied owner could only ever disagree with
  # it. The owner is read back from GitHub instead (status.owner.login) and used for the item verbs.
  "/user/repos":
    # CREATE is user-scoped: the repository is created in the token's own account. This is the
    # sibling of Repository's org-scoped create — a separate kind because a RestDefinition has
    # exactly ONE create verb and cannot choose /orgs/{org}/repos vs /user/repos at runtime.
    post:
      summary: Create a repository for the authenticated user
      operationId: repos/create-for-authenticated-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                homepage:
                  type: string
                private:
                  type: boolean
                visibility:
                  type: string
                has_issues:
                  type: boolean
                has_wiki:
                  type: boolean
                has_projects:
                  type: boolean
                # CREATE-ONLY and load-bearing, exactly as in Repository: a repo created with
                # auto_init=false has no commit and no default branch, so a later GitRef or
                # RepoContent aimed at it fails until someone pushes by hand.
                auto_init:
                  type: boolean
                  default: true
                gitignore_template:
                  type: string
                license_template:
                  type: string
                # As GitHub's create body publishes them (deviation review rows 38a), with GitHub's
                # `default`s left out on purpose: a CRD default would be written into every existing CR
                # (oasgen-provider#562). Those also in the PATCH body below are compared and fixable;
                # the rest act once, at create.
                allow_auto_merge:
                  description: Whether to allow Auto-merge to be used on pull requests.
                  type: boolean
                allow_merge_commit:
                  description: Whether to allow merge commits for pull requests.
                  type: boolean
                allow_rebase_merge:
                  description: Whether to allow rebase merges for pull requests.
                  type: boolean
                allow_squash_merge:
                  description: Whether to allow squash merges for pull requests.
                  type: boolean
                delete_branch_on_merge:
                  description: Whether to delete head branches when pull requests are merged
                  type: boolean
                has_discussions:
                  description: Whether discussions are enabled.
                  type: boolean
                has_downloads:
                  description: Whether downloads are enabled.
                  type: boolean
                is_template:
                  description: Whether this repository acts as a template that can be used to generate new repositories.
                  type: boolean
                merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - PR_TITLE
                  - BLANK
                  description: 'The default value for a merge commit message.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `PR_BODY` - default to the pull request''s body.

                    - `BLANK` - default to a blank commit message.'
                merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - MERGE_MESSAGE
                  description: 'Required when using `merge_commit_message`.


                    The default value for a merge commit title.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull request #123
                    from branch-name).'
                squash_merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - COMMIT_MESSAGES
                  - BLANK
                  description: 'The default value for a squash merge commit message:


                    - `PR_BODY` - default to the pull request''s body.

                    - `COMMIT_MESSAGES` - default to the branch''s commit messages.

                    - `BLANK` - default to a blank commit message.'
                squash_merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - COMMIT_OR_PR_TITLE
                  description: 'Required when using `squash_merge_commit_message`.


                    The default value for a squash merge commit title:


                    - `PR_TITLE` - default to the pull request''s title.

                    - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
                    title (when more than one commit).'
                team_id:
                  description: The id of the team that will be granted access to this repository. This is only valid when
                    creating a repository in an organization.
                  type: integer
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
    # FINDBY — the observe used while status.owner.login is still empty (first observe before the
    # create, or a CR whose status was lost). It needs no owner at all: it lists the token user's
    # repositories and matches the identifier `name`. The query parameters below are pinned by the
    # findby verb's static `queries` / `pagination`. oasgen merges parameters from every verb into
    # the spec, so what keeps them off the CRD is their excludedSpecFields entries, which are
    # load-bearing.
    get:
      summary: List repositories for the authenticated user
      operationId: repos/list-for-authenticated-user
      parameters:
        - $ref: '#/components/parameters/affiliation'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
  # GET/PATCH address the repo as /repos/{owner}/{name}. `owner` is NOT a spec field — oasgen omits
  # a parameter that a mapping supplies (so its excludedSpecFields entry is a redundant no-op), and
  # both verbs source it from status.owner.login,
  # which GitHub reports on the create, get and findby responses. `name` is sourced from
  # status.name (the name GitHub assigned) on both verbs too — the oasgen-provider #386 fix — so a
  # name GitHub normalised on create ("my repo" -> "my-repo") is still addressable; see
  # rd-userrepository.yaml. Before that status exists the get cannot be built, so the
  # controller observes through the findby above instead. DELETE (below) deletes the repository on
  # GitHub, an adopted one included; annotate the CR `krateo.io/deletion-policy: orphan` to keep
  # it. The oasgen-provider #125 CRD cascade that once made a delete verb dangerous is fixed:
  # oasgen refuses to drop a CRD that still has instances.
  "/repos/{owner}/{name}":
    get:
      summary: Get a repository
      operationId: repos/get-user-repo
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
    patch:
      summary: Update a repository
      operationId: repos/update-user-repo
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                # `name`, `private` and `visibility` are accepted by GitHub's PATCH but are
                # DELIBERATELY NOT MODELLED HERE, for the identical reasons documented at length in
                # repository.yaml: compared in the `updatable` set, `name` would let drift RENAME a
                # live repo (307 redirect trap) and `private`/`visibility` would let a re-rendered
                # consumer value flip the exposure of repositories that already exist (irreversible).
                # All three remain CREATE-body fields, so the CRD and create-time behaviour are
                # unchanged; only reconciling them as drift is gone, which is correct.
                # hack/assert-drift-invariants.py asserts this absence.
                description:
                  type: string
                homepage:
                  type: string
                has_issues:
                  type: boolean
                has_wiki:
                  type: boolean
                has_projects:
                  type: boolean
                default_branch:
                  type: string
                archived:
                  type: boolean
                # As GitHub's update body publishes them (deviation review row 41b), `default`s left out.
                # Compared under `updatable` only when the CR sets them (the create body declares them).
                # allow_forking, allow_update_branch, has_pull_requests, pull_request_creation_policy,
                # security_and_analysis and web_commit_signoff_required are update-only, so no CR can
                # set them yet (oasgen builds the spec from the create body; oasgen-provider#491).
                allow_auto_merge:
                  type: boolean
                  description: Either `true` to allow auto-merge on pull requests, or `false` to disallow auto-merge.
                allow_forking:
                  type: boolean
                  description: Either `true` to allow private forks, or `false` to prevent private forks.
                allow_merge_commit:
                  type: boolean
                  description: Either `true` to allow merging pull requests with a merge commit, or `false` to prevent
                    merging pull requests with merge commits.
                allow_rebase_merge:
                  type: boolean
                  description: Either `true` to allow rebase-merging pull requests, or `false` to prevent rebase-merging.
                allow_squash_merge:
                  type: boolean
                  description: Either `true` to allow squash-merging pull requests, or `false` to prevent squash-merging.
                allow_update_branch:
                  type: boolean
                  description: Either `true` to always allow a pull request head branch that is behind its base branch
                    to be updated even if it is not required to be up to date before merging, or false otherwise.
                delete_branch_on_merge:
                  type: boolean
                  description: Either `true` to allow automatically deleting head branches when pull requests are merged,
                    or `false` to prevent automatic deletion.
                has_pull_requests:
                  type: boolean
                  description: Either `true` to allow pull requests for this repository or `false` to prevent pull requests.
                is_template:
                  type: boolean
                  description: Either `true` to make this repo available as a template repository or `false` to prevent
                    it.
                merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - PR_TITLE
                  - BLANK
                  description: 'The default value for a merge commit message.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `PR_BODY` - default to the pull request''s body.

                    - `BLANK` - default to a blank commit message.'
                merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - MERGE_MESSAGE
                  description: 'Required when using `merge_commit_message`.


                    The default value for a merge commit title.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull request #123
                    from branch-name).'
                pull_request_creation_policy:
                  type: string
                  description: 'The policy that controls who can create pull requests for this repository: `all` or `collaborators_only`.'
                  enum:
                  - all
                  - collaborators_only
                security_and_analysis:
                  type: object
                  description: 'Specify which security and analysis features to enable or disable for the repository.


                    To use this parameter, you must have admin permissions for the repository or be an owner or security
                    manager for the organization that owns the repository. For more information, see "[Managing security
                    managers in your organization](https://docs.github.com/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    For example, to enable GitHub Advanced Security, use this data in the body of the `PATCH` request:

                    `{ "security_and_analysis": {"advanced_security": { "status": "enabled" } } }`.


                    You can check which security and analysis features are currently enabled by using a `GET /repos/{owner}/{repo}`
                    request.'
                  nullable: true
                  properties:
                    advanced_security:
                      type: object
                      description: 'Use the `status` property to enable or disable GitHub Advanced Security for this repository.

                        For more information, see "[About GitHub Advanced

                        Security](/github/getting-started-with-github/learning-about-github/about-github-advanced-security)."


                        For standalone Code Scanning or Secret Protection products, this parameter cannot be used.'
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    code_security:
                      type: object
                      description: Use the `status` property to enable or disable GitHub Code Security for this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning for this repository.
                        For more information, see "[About secret scanning](/code-security/secret-security/about-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_push_protection:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning push protection for
                        this repository. For more information, see "[Protecting pushes with secret scanning](/code-security/secret-scanning/protecting-pushes-with-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_ai_detection:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning AI detection for this
                        repository. For more information, see "[Responsible detection of generic secrets with AI](https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/generic-secret-detection/responsible-ai-generic-secrets)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_non_provider_patterns:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning non-provider patterns
                        for this repository. For more information, see "[Supported secret scanning patterns](/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_alert_dismissal:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning delegated alert dismissal
                        for this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_bypass:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning delegated bypass for
                        this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_bypass_options:
                      type: object
                      description: 'Feature options for secret scanning delegated bypass.

                        This object is only honored when `security_and_analysis.secret_scanning_delegated_bypass.status`
                        is set to `enabled`.

                        You can send this object in the same request as `secret_scanning_delegated_bypass`, or update
                        just the options in a separate request.'
                      properties:
                        reviewers:
                          type: array
                          description: 'The bypass reviewers for secret scanning delegated bypass.

                            If you omit this field, the existing set of reviewers is unchanged.'
                          items:
                            type: object
                            required:
                            - reviewer_id
                            - reviewer_type
                            properties:
                              reviewer_id:
                                type: integer
                                description: The ID of the team or role selected as a bypass reviewer
                              reviewer_type:
                                type: string
                                description: The type of the bypass reviewer
                                enum:
                                - TEAM
                                - ROLE
                              mode:
                                type: string
                                description: The bypass mode for the reviewer
                                enum:
                                - ALWAYS
                                - EXEMPT
                squash_merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - COMMIT_MESSAGES
                  - BLANK
                  description: 'The default value for a squash merge commit message:


                    - `PR_BODY` - default to the pull request''s body.

                    - `COMMIT_MESSAGES` - default to the branch''s commit messages.

                    - `BLANK` - default to a blank commit message.'
                squash_merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - COMMIT_OR_PR_TITLE
                  description: 'Required when using `squash_merge_commit_message`.


                    The default value for a squash merge commit title:


                    - `PR_TITLE` - default to the pull request''s title.

                    - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
                    title (when more than one commit).'
                use_squash_pr_title_as_default:
                  type: boolean
                  description: Either `true` to allow squash-merge commits to use pull request title, or `false` to use
                    commit message. **This property is closing down. Please use `squash_merge_commit_title` instead.
                  deprecated: true
                web_commit_signoff_required:
                  type: boolean
                  description: Either `true` to require contributors to sign off on web-based commits, or `false` to not
                    require contributors to sign off on web-based commits.
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
    # DELETE is GitHub's repos/delete (rest-api-description api.github.com.json, operationId
    # repos/delete), copied as it is: same responses, same error schema. The path parameters keep this asset's `owner`/`name` names, as get and patch do.
    # Deleting the CR now deletes the repository on GitHub. To keep the repository when its CR goes
    # away, annotate the CR with `krateo.io/deletion-policy: orphan` (see docs/usage.md).
    delete:
      summary: Delete a repository
      operationId: repos/delete
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/name'
      responses:
        '204':
          description: Response
        '307':
          $ref: '#/components/responses/temporary_redirect'
        '403':
          description: "If an organization owner has configured the organization to prevent members from deleting organization-owned repositories, a member will get this response:"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  documentation_url:
                    type: string
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
    # GitHub's GET /user/repos lists every repository the token can reach — owned, collaborated
    # on, and org-member repositories alike — so a bare name match could bind to an org repo of the
    # same name. affiliation=owner restricts it to repos the user OWNS, where names are unique.
    affiliation:
      name: affiliation
      in: query
      required: false
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated, pushed, full_name]
    direction:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
    per_page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 30
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
  responses:
    temporary_redirect:
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    not_found:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
  schemas:
    Repository:
      type: object
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        full_name:
          type: string
        # The owner GitHub actually assigned (the token's account). Captured to status.owner.login
        # and fed back into the get/update path — the reason this kind needs no hand-set owner.
        owner:
          type: object
          properties:
            login:
              type: string
        html_url:
          type: string
        clone_url:
          type: string
        ssh_url:
          type: string
        default_branch:
          type: string
        private:
          type: boolean
        visibility:
          type: string
        description:
          type: string
        homepage:
          type: string
        has_issues:
          type: boolean
        has_wiki:
          type: boolean
        has_projects:
          type: boolean
        archived:
          type: boolean
        # Returned by GET (GitHub's full-repository), so the fields above can be compared.
        allow_auto_merge:
          type: boolean
        allow_forking:
          type: boolean
        allow_merge_commit:
          type: boolean
        allow_rebase_merge:
          type: boolean
        allow_squash_merge:
          type: boolean
        allow_update_branch:
          type: boolean
        delete_branch_on_merge:
          type: boolean
        has_discussions:
          type: boolean
        has_downloads:
          type: boolean
        has_pull_requests:
          type: boolean
        is_template:
          type: boolean
        merge_commit_message:
          type: string
          enum:
          - PR_BODY
          - PR_TITLE
          - BLANK
          description: 'The default value for a merge commit message.


            - `PR_TITLE` - default to the pull request''s title.

            - `PR_BODY` - default to the pull request''s body.

            - `BLANK` - default to a blank commit message.'
        merge_commit_title:
          type: string
          enum:
          - PR_TITLE
          - MERGE_MESSAGE
          description: "The default value for a merge commit title.\n\n  - `PR_TITLE` - default to the pull request's\
            \ title.\n  - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull\
            \ request #123 from branch-name)."
        pull_request_creation_policy:
          description: 'The policy controlling who can create pull requests: all or collaborators_only.'
          type: string
          enum:
          - all
          - collaborators_only
        security_and_analysis:
          nullable: true
          type: object
          properties:
            advanced_security:
              description: 'Enable or disable GitHub Advanced Security for the repository.


                For standalone Code Scanning or Secret Protection products, this parameter cannot be used.

                '
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            code_security:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            dependabot_security_updates:
              description: Enable or disable Dependabot security updates for the repository.
              type: object
              properties:
                status:
                  description: The enablement status of Dependabot security updates for the repository.
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_push_protection:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_non_provider_patterns:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_ai_detection:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_alert_dismissal:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_bypass:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_bypass_options:
              type: object
              properties:
                reviewers:
                  type: array
                  description: The bypass reviewers for secret scanning delegated bypass
                  items:
                    type: object
                    required:
                    - reviewer_id
                    - reviewer_type
                    properties:
                      reviewer_id:
                        type: integer
                        description: The ID of the team or role selected as a bypass reviewer
                      reviewer_type:
                        type: string
                        description: The type of the bypass reviewer
                        enum:
                        - TEAM
                        - ROLE
                      mode:
                        type: string
                        description: The bypass mode for the reviewer
                        enum:
                        - ALWAYS
                        - EXEMPT
        squash_merge_commit_message:
          type: string
          enum:
          - PR_BODY
          - COMMIT_MESSAGES
          - BLANK
          description: 'The default value for a squash merge commit message:


            - `PR_BODY` - default to the pull request''s body.

            - `COMMIT_MESSAGES` - default to the branch''s commit messages.

            - `BLANK` - default to a blank commit message.'
        squash_merge_commit_title:
          type: string
          enum:
          - PR_TITLE
          - COMMIT_OR_PR_TITLE
          description: 'The default value for a squash merge commit title:


            - `PR_TITLE` - default to the pull request''s title.

            - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
            title (when more than one commit).'
        use_squash_pr_title_as_default:
          type: boolean
        web_commit_signoff_required:
          type: boolean
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
security:
  - accessToken: []
