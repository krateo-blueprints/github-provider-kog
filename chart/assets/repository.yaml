openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - Repositories
servers:
  - url: https://api.github.com
paths:
  # CREATE is org-scoped. GitHub's second create endpoint, POST /user/repos (user-owned
  # repos), is modelled as a SEPARATE kind, UserRepository (assets/userrepository.yaml) —
  # a RestDefinition has one create verb and a resource cannot choose between two paths, so
  # the user-owned variant is its own RestDefinition rather than a branch of this one.
  "/orgs/{org}/repos":
    post:
      summary: Create an organization repository
      operationId: repos/create-in-org
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                homepage:
                  type: string
                private:
                  type: boolean
                visibility:
                  type: string
                has_issues:
                  type: boolean
                has_wiki:
                  type: boolean
                has_projects:
                  type: boolean
                # CREATE-ONLY, and load-bearing for a Krateo destination repository.
                # A repo created with auto_init=false has no commit and therefore no default
                # branch, so a GitRef or RepoContent aimed at it fails until someone pushes by
                # hand. Leave this true unless the caller really wants an empty repo.
                auto_init:
                  type: boolean
                  default: true
                gitignore_template:
                  type: string
                license_template:
                  type: string
                # As GitHub's create body publishes them (deviation review rows 28), with GitHub's
                # `default`s left out on purpose: a CRD default would be written into every existing CR
                # (oasgen-provider#562). Those also in the PATCH body below are compared and fixable;
                # the rest act once, at create.
                allow_auto_merge:
                  type: boolean
                  description: Either `true` to allow auto-merge on pull requests, or `false` to disallow auto-merge.
                allow_merge_commit:
                  type: boolean
                  description: Either `true` to allow merging pull requests with a merge commit, or `false` to prevent
                    merging pull requests with merge commits.
                allow_rebase_merge:
                  type: boolean
                  description: Either `true` to allow rebase-merging pull requests, or `false` to prevent rebase-merging.
                allow_squash_merge:
                  type: boolean
                  description: Either `true` to allow squash-merging pull requests, or `false` to prevent squash-merging.
                custom_properties:
                  type: object
                  description: The custom properties for the new repository. The keys are the custom property names, and
                    the values are the corresponding custom property values.
                  additionalProperties: true
                delete_branch_on_merge:
                  type: boolean
                  description: Either `true` to allow automatically deleting head branches when pull requests are merged,
                    or `false` to prevent automatic deletion. **The authenticated user must be an organization owner to
                    set this property to `true`.**
                has_downloads:
                  description: Whether downloads are enabled.
                  type: boolean
                is_template:
                  type: boolean
                  description: Either `true` to make this repo available as a template repository or `false` to prevent
                    it.
                merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - PR_TITLE
                  - BLANK
                  description: 'The default value for a merge commit message.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `PR_BODY` - default to the pull request''s body.

                    - `BLANK` - default to a blank commit message.'
                merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - MERGE_MESSAGE
                  description: 'Required when using `merge_commit_message`.


                    The default value for a merge commit title.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull request #123
                    from branch-name).'
                squash_merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - COMMIT_MESSAGES
                  - BLANK
                  description: 'The default value for a squash merge commit message:


                    - `PR_BODY` - default to the pull request''s body.

                    - `COMMIT_MESSAGES` - default to the branch''s commit messages.

                    - `BLANK` - default to a blank commit message.'
                squash_merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - COMMIT_OR_PR_TITLE
                  description: 'Required when using `squash_merge_commit_message`.


                    The default value for a squash merge commit title:


                    - `PR_TITLE` - default to the pull request''s title.

                    - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
                    title (when more than one commit).'
                team_id:
                  type: integer
                  description: The id of the team that will be granted access to this repository. This is only valid when
                    creating a repository in an organization.
                use_squash_pr_title_as_default:
                  type: boolean
                  description: Either `true` to allow squash-merge commits to use pull request title, or `false` to use
                    commit message. **This property is closing down. Please use `squash_merge_commit_title` instead.
                  deprecated: true
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
  # GET/PATCH/DELETE address the repo as /repos/{owner}/{repo} upstream. The parameters are
  # named `org` and `name` here ON PURPOSE: the same two CR fields then serve the create path
  # (/orgs/{org}/repos) and the create body (`name`), so the generated CRD carries ONE pair of
  # fields instead of an `org`/`owner` duplicate the author has to keep in sync.
  "/repos/{org}/{name}":
    get:
      summary: Get a repository
      operationId: repos/get
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
    patch:
      summary: Update a repository
      operationId: repos/update
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                # `name` IS accepted by GitHub's PATCH — and is DELIBERATELY NOT MODELLED HERE.
                #
                # Including it put `name` in the `updatable` compare set, which made renaming a
                # repository something drift reconciliation would do on its own. Two ways that bit
                # in production on krateo-057 (2026-09-10):
                #
                #   GitHub REDIRECTS a renamed repo. `krateo-platformops/krateo-oas` is now
                #   `krateo-platformops/oas`; the observe GET follows the redirect and reports
                #   name=oas, the spec still says krateo-oas, so the comparison saw drift and
                #   issued a PATCH — which GitHub answered 307, and the controller surfaced as
                #   `update failed: unexpected status: 307`. The error was the good outcome: had
                #   the redirect been followed, the reconcile would have RENAMED a live repository
                #   back to a stale name nobody asked for.
                #
                # `name` remains a path parameter and a create-body field, so creating and
                # addressing a repository are unaffected. Only reconciling a rename is gone, and
                # it should be: renaming is a deliberate act, not drift.
                #
                # Addressing is keyed on status.name (the name GitHub assigned), not spec.name —
                # the get/update verbs in rd-repository.yaml map inPath name <- status.name
                # (oasgen-provider #386). Keeping `name` OUT of this PATCH body is what makes that
                # safe: were it in the body it would re-enter the `updatable` compare set, and
                # tracking the real name would then PATCH it back to spec.name every reconcile.
                description:
                  type: string
                homepage:
                  type: string
                # `private` and `visibility` ARE accepted by GitHub's PATCH — and are DELIBERATELY
                # NOT MODELLED HERE. Exposure is honoured at CREATE and ignored afterwards.
                #
                # In the PATCH body they sit in the `updatable` compare set, which makes "change
                # this repository's exposure" something drift reconciliation decides on its own.
                # Consumers render a Repository on every composition and core-provider's default
                # UpgradePolicy is Automatic, so a consumer changing its rendered value does not
                # only affect repositories created afterwards — the next reconcile PATCHes the ones
                # that already exist.
                #
                # Caught in review of portal#227 (this repo's #11), which flips builder-publish's
                # destination repos public because a GHCR package inherits the visibility of the
                # repo that published it. Its PR body said "existing ones keep their visibility";
                # with these two fields compared that was false, and merging it would have flipped
                # live private repositories public on the next reconcile. There is no undo — forks,
                # clones, caches and search indexing survive a flip back.
                #
                # Dropping them from the body does more than un-compare them. The outgoing body is
                # filtered to the fields the operation declares (rest-dynamic-controller,
                # builder.go processFields), so a PATCH triggered by `description` drift carries no
                # visibility field either, and GitHub's PATCH is partial — omitting it leaves the
                # repository as it is.
                #
                # Both remain CREATE-body fields, so `spec.private`/`spec.visibility` still exist on
                # the CRD — oasgen builds the spec from the create body plus path/query params,
                # never from the update body — and are still honoured at create. The CRD does not
                # change. Which repositories are public is a decision their owner makes, not one a
                # chart version bump makes for them.
                has_issues:
                  type: boolean
                has_wiki:
                  type: boolean
                has_projects:
                  type: boolean
                default_branch:
                  type: string
                archived:
                  type: boolean
                # As GitHub's update body publishes them (deviation review row 30b), `default`s left out.
                # Compared under `updatable` only when the CR sets them (the create body declares them).
                # allow_forking, allow_update_branch, has_pull_requests, pull_request_creation_policy,
                # security_and_analysis and web_commit_signoff_required are update-only, so no CR can
                # set them yet (oasgen builds the spec from the create body; oasgen-provider#491).
                allow_auto_merge:
                  type: boolean
                  description: Either `true` to allow auto-merge on pull requests, or `false` to disallow auto-merge.
                allow_forking:
                  type: boolean
                  description: Either `true` to allow private forks, or `false` to prevent private forks.
                allow_merge_commit:
                  type: boolean
                  description: Either `true` to allow merging pull requests with a merge commit, or `false` to prevent
                    merging pull requests with merge commits.
                allow_rebase_merge:
                  type: boolean
                  description: Either `true` to allow rebase-merging pull requests, or `false` to prevent rebase-merging.
                allow_squash_merge:
                  type: boolean
                  description: Either `true` to allow squash-merging pull requests, or `false` to prevent squash-merging.
                allow_update_branch:
                  type: boolean
                  description: Either `true` to always allow a pull request head branch that is behind its base branch
                    to be updated even if it is not required to be up to date before merging, or false otherwise.
                delete_branch_on_merge:
                  type: boolean
                  description: Either `true` to allow automatically deleting head branches when pull requests are merged,
                    or `false` to prevent automatic deletion.
                has_pull_requests:
                  type: boolean
                  description: Either `true` to allow pull requests for this repository or `false` to prevent pull requests.
                is_template:
                  type: boolean
                  description: Either `true` to make this repo available as a template repository or `false` to prevent
                    it.
                merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - PR_TITLE
                  - BLANK
                  description: 'The default value for a merge commit message.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `PR_BODY` - default to the pull request''s body.

                    - `BLANK` - default to a blank commit message.'
                merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - MERGE_MESSAGE
                  description: 'Required when using `merge_commit_message`.


                    The default value for a merge commit title.


                    - `PR_TITLE` - default to the pull request''s title.

                    - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull request #123
                    from branch-name).'
                pull_request_creation_policy:
                  type: string
                  description: 'The policy that controls who can create pull requests for this repository: `all` or `collaborators_only`.'
                  enum:
                  - all
                  - collaborators_only
                security_and_analysis:
                  type: object
                  description: 'Specify which security and analysis features to enable or disable for the repository.


                    To use this parameter, you must have admin permissions for the repository or be an owner or security
                    manager for the organization that owns the repository. For more information, see "[Managing security
                    managers in your organization](https://docs.github.com/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."


                    For example, to enable GitHub Advanced Security, use this data in the body of the `PATCH` request:

                    `{ "security_and_analysis": {"advanced_security": { "status": "enabled" } } }`.


                    You can check which security and analysis features are currently enabled by using a `GET /repos/{owner}/{repo}`
                    request.'
                  nullable: true
                  properties:
                    advanced_security:
                      type: object
                      description: 'Use the `status` property to enable or disable GitHub Advanced Security for this repository.

                        For more information, see "[About GitHub Advanced

                        Security](/github/getting-started-with-github/learning-about-github/about-github-advanced-security)."


                        For standalone Code Scanning or Secret Protection products, this parameter cannot be used.'
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    code_security:
                      type: object
                      description: Use the `status` property to enable or disable GitHub Code Security for this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning for this repository.
                        For more information, see "[About secret scanning](/code-security/secret-security/about-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_push_protection:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning push protection for
                        this repository. For more information, see "[Protecting pushes with secret scanning](/code-security/secret-scanning/protecting-pushes-with-secret-scanning)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_ai_detection:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning AI detection for this
                        repository. For more information, see "[Responsible detection of generic secrets with AI](https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/generic-secret-detection/responsible-ai-generic-secrets)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_non_provider_patterns:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning non-provider patterns
                        for this repository. For more information, see "[Supported secret scanning patterns](/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_alert_dismissal:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning delegated alert dismissal
                        for this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_bypass:
                      type: object
                      description: Use the `status` property to enable or disable secret scanning delegated bypass for
                        this repository.
                      properties:
                        status:
                          type: string
                          description: Can be `enabled` or `disabled`.
                    secret_scanning_delegated_bypass_options:
                      type: object
                      description: 'Feature options for secret scanning delegated bypass.

                        This object is only honored when `security_and_analysis.secret_scanning_delegated_bypass.status`
                        is set to `enabled`.

                        You can send this object in the same request as `secret_scanning_delegated_bypass`, or update
                        just the options in a separate request.'
                      properties:
                        reviewers:
                          type: array
                          description: 'The bypass reviewers for secret scanning delegated bypass.

                            If you omit this field, the existing set of reviewers is unchanged.'
                          items:
                            type: object
                            required:
                            - reviewer_id
                            - reviewer_type
                            properties:
                              reviewer_id:
                                type: integer
                                description: The ID of the team or role selected as a bypass reviewer
                              reviewer_type:
                                type: string
                                description: The type of the bypass reviewer
                                enum:
                                - TEAM
                                - ROLE
                              mode:
                                type: string
                                description: The bypass mode for the reviewer
                                enum:
                                - ALWAYS
                                - EXEMPT
                squash_merge_commit_message:
                  type: string
                  enum:
                  - PR_BODY
                  - COMMIT_MESSAGES
                  - BLANK
                  description: 'The default value for a squash merge commit message:


                    - `PR_BODY` - default to the pull request''s body.

                    - `COMMIT_MESSAGES` - default to the branch''s commit messages.

                    - `BLANK` - default to a blank commit message.'
                squash_merge_commit_title:
                  type: string
                  enum:
                  - PR_TITLE
                  - COMMIT_OR_PR_TITLE
                  description: 'Required when using `squash_merge_commit_message`.


                    The default value for a squash merge commit title:


                    - `PR_TITLE` - default to the pull request''s title.

                    - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
                    title (when more than one commit).'
                use_squash_pr_title_as_default:
                  type: boolean
                  description: Either `true` to allow squash-merge commits to use pull request title, or `false` to use
                    commit message. **This property is closing down. Please use `squash_merge_commit_title` instead.
                  deprecated: true
                web_commit_signoff_required:
                  type: boolean
                  description: Either `true` to require contributors to sign off on web-based commits, or `false` to not
                    require contributors to sign off on web-based commits.
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
    # DELETE is GitHub's repos/delete (rest-api-description api.github.com.json, operationId
    # repos/delete), copied as it is: same responses, same error schema. The path parameters keep this asset's `org`/`name` names, as get and patch do.
    # Deleting the CR now deletes the repository on GitHub. To keep the repository when its CR goes
    # away, annotate the CR with `krateo.io/deletion-policy: orphan` (see docs/usage.md).
    delete:
      summary: Delete a repository
      operationId: repos/delete
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/name'
      responses:
        '204':
          description: Response
        '307':
          $ref: '#/components/responses/temporary_redirect'
        '403':
          description: "If an organization owner has configured the organization to prevent members from deleting organization-owned repositories, a member will get this response:"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  documentation_url:
                    type: string
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    org:
      name: org
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    temporary_redirect:
      description: Temporary Redirect
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    not_found:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
  schemas:
    Repository:
      type: object
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        full_name:
          type: string
        html_url:
          type: string
        # clone_url / ssh_url are what a downstream GitRef, RepoContent or CI job actually
        # needs to reach the repository, so they are surfaced on status.
        clone_url:
          type: string
        ssh_url:
          type: string
        default_branch:
          type: string
        private:
          type: boolean
        visibility:
          type: string
        description:
          type: string
        homepage:
          type: string
        has_issues:
          type: boolean
        has_wiki:
          type: boolean
        has_projects:
          type: boolean
        archived:
          type: boolean
        # Returned by GET (GitHub's full-repository), so the fields above can be compared.
        allow_auto_merge:
          type: boolean
        allow_forking:
          type: boolean
        allow_merge_commit:
          type: boolean
        allow_rebase_merge:
          type: boolean
        allow_squash_merge:
          type: boolean
        allow_update_branch:
          type: boolean
        custom_properties:
          type: object
          description: The custom properties that were defined for the repository. The keys are the custom property
            names, and the values are the corresponding custom property values.
          additionalProperties: true
        delete_branch_on_merge:
          type: boolean
        has_downloads:
          type: boolean
        has_pull_requests:
          type: boolean
        is_template:
          type: boolean
        merge_commit_message:
          type: string
          enum:
          - PR_BODY
          - PR_TITLE
          - BLANK
          description: 'The default value for a merge commit message.


            - `PR_TITLE` - default to the pull request''s title.

            - `PR_BODY` - default to the pull request''s body.

            - `BLANK` - default to a blank commit message.'
        merge_commit_title:
          type: string
          enum:
          - PR_TITLE
          - MERGE_MESSAGE
          description: "The default value for a merge commit title.\n\n  - `PR_TITLE` - default to the pull request's\
            \ title.\n  - `MERGE_MESSAGE` - default to the classic title for a merge message (e.g., Merge pull\
            \ request #123 from branch-name)."
        pull_request_creation_policy:
          description: 'The policy controlling who can create pull requests: all or collaborators_only.'
          type: string
          enum:
          - all
          - collaborators_only
        security_and_analysis:
          nullable: true
          type: object
          properties:
            advanced_security:
              description: 'Enable or disable GitHub Advanced Security for the repository.


                For standalone Code Scanning or Secret Protection products, this parameter cannot be used.

                '
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            code_security:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            dependabot_security_updates:
              description: Enable or disable Dependabot security updates for the repository.
              type: object
              properties:
                status:
                  description: The enablement status of Dependabot security updates for the repository.
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_push_protection:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_non_provider_patterns:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_ai_detection:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_alert_dismissal:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_bypass:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - enabled
                  - disabled
            secret_scanning_delegated_bypass_options:
              type: object
              properties:
                reviewers:
                  type: array
                  description: The bypass reviewers for secret scanning delegated bypass
                  items:
                    type: object
                    required:
                    - reviewer_id
                    - reviewer_type
                    properties:
                      reviewer_id:
                        type: integer
                        description: The ID of the team or role selected as a bypass reviewer
                      reviewer_type:
                        type: string
                        description: The type of the bypass reviewer
                        enum:
                        - TEAM
                        - ROLE
                      mode:
                        type: string
                        description: The bypass mode for the reviewer
                        enum:
                        - ALWAYS
                        - EXEMPT
        squash_merge_commit_message:
          type: string
          enum:
          - PR_BODY
          - COMMIT_MESSAGES
          - BLANK
          description: 'The default value for a squash merge commit message:


            - `PR_BODY` - default to the pull request''s body.

            - `COMMIT_MESSAGES` - default to the branch''s commit messages.

            - `BLANK` - default to a blank commit message.'
        squash_merge_commit_title:
          type: string
          enum:
          - PR_TITLE
          - COMMIT_OR_PR_TITLE
          description: 'The default value for a squash merge commit title:


            - `PR_TITLE` - default to the pull request''s title.

            - `COMMIT_OR_PR_TITLE` - default to the commit''s title (if only one commit) or the pull request''s
            title (when more than one commit).'
        use_squash_pr_title_as_default:
          type: boolean
        web_commit_signoff_required:
          type: boolean
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
security:
  - accessToken: []
