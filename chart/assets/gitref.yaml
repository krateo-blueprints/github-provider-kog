openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - Git References
servers:
  # The ONLY server. No per-operation override, no plugin — the companion
  # github-rest-dynamic-controller-plugin is NOT involved. The pre-call base-sha read the plugin
  # used to do is expressed natively by the create verb's dependentLookup (see rd-gitref.yaml).
  - url: https://api.github.com
paths:
  "/repos/{owner}/{repo}/git/refs":
    post:
      summary: Create a reference
      operationId: git/create-ref
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ref
              properties:
                ref:
                  type: string
                  # SHORT form: "heads/builder/demo" (or "tags/v1.0.0"). GitHub's create-ref body
                  # actually wants the FULL "refs/heads/..." form; the create requestTransform in
                  # rd-gitref.yaml adds the "refs/" prefix. spec.ref is kept SHORT because the
                  # get/update/delete paths address the ref in the short form, so one spec value
                  # serves every verb with no field juggling.
                  #
                  # The pattern is the GUARD and the reason this shape is safe to ship: a CR carrying
                  # the full "refs/..." form is rejected at ADMISSION instead of creating a branch the
                  # observe verb (short form) can never find — a silent create->422 loop. The pattern
                  # survives CRD generation verbatim. RE2 has no lookahead, so this is an allow-list,
                  # not a negation of "refs/".
                  pattern: '^(heads|tags)/.+'
                sha:
                  type: string
                  # OPTIONAL. The base commit the new ref is cut from. GitHub's create-ref REQUIRES a
                  # sha, but a blueprint author creating "heads/builder/demo" has none at hand, so when
                  # spec.sha is ABSENT the create verb resolves it with a dependentLookup (repo ->
                  # default_branch -> that branch's head sha; see rd-gitref.yaml). An explicitly set
                  # spec.sha wins and costs no extra API calls. `sha` is a create-time INPUT consumed
                  # once, never desired state — it is deliberately kept out of the drift comparison
                  # (see docs/design-gitref.md §3.3). Needs oasgen-provider >= 0.36.0.
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRef'
  # Singular `ref` — GitHub's per-ref READ endpoint. Answers with {ref, node_id, url, object} where
  # `ref` is the FULL "refs/heads/..." form; the get verb's responseTransform trims it back to short.
  "/repos/{owner}/{repo}/git/ref/{ref}":
    get:
      summary: Get a reference
      operationId: git/get-ref
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ref'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRef'
  # Plural `refs` — GitHub's per-ref WRITE endpoints. They take the ref in the SHORT form too
  # (probed: /git/refs/heads/main -> 200), so {ref} auto-populates from spec.ref unchanged.
  "/repos/{owner}/{repo}/git/refs/{ref}":
    patch:
      summary: Update a reference
      operationId: git/update-ref
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ref'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sha
              properties:
                sha:
                  type: string
                force:
                  type: boolean
                  # `force` never appears in any response, so it is never compared under any scope.
                  default: false
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRef'
    delete:
      summary: Delete a reference
      operationId: git/delete-ref
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/ref'
      responses:
        '204':
          description: Response
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    ref:
      name: ref
      in: path
      required: true
      schema:
        type: string
  schemas:
    GitRef:
      type: object
      properties:
        ref:
          type: string
        node_id:
          type: string
        url:
          type: string
        object:
          type: object
          properties:
            type:
              type: string
            sha:
              type: string
            url:
              type: string
security:
  - accessToken: []
