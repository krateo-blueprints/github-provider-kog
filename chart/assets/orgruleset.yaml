openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - Organization Rulesets
servers:
  - url: https://api.github.com
paths:
  # The org-level twin of assets/reporuleset.yaml. Same body, same response, same server-assigned
  # id; the two differences are the scope (`org` instead of `owner`/`repo`) and the conditions,
  # which here must also choose WHICH repositories the ruleset applies to.
  "/orgs/{org}/rulesets":
    post:
      summary: Create an organization repository ruleset
      operationId: repos/create-org-ruleset
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - enforcement
              properties:
                name:
                  type: string
                target:
                  type: string
                  enum:
                    - branch
                    - tag
                    - push
                  default: branch
                # `evaluate` (dry-run) is GitHub Enterprise only; elsewhere GitHub 422s.
                enforcement:
                  type: string
                  enum:
                    - disabled
                    - active
                    - evaluate
                bypass_actors:
                  type: array
                  items:
                    $ref: '#/components/schemas/BypassActor'
                conditions:
                  $ref: '#/components/schemas/Conditions'
                rules:
                  $ref: '#/components/schemas/Rules'
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
  # ruleset_id is assigned by GitHub on create. It is excluded from the spec and bound from
  # status.id by requestFieldMapping (see rd-orgruleset.yaml).
  "/orgs/{org}/rulesets/{ruleset_id}":
    get:
      summary: Get an organization repository ruleset
      operationId: repos/get-org-ruleset
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/ruleset_id'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
    put:
      summary: Update an organization repository ruleset
      operationId: repos/update-org-ruleset
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/ruleset_id'
      # The SAME property set as create, with nothing required — GitHub keeps whatever the body
      # omits. Every create field is therefore updatable and this resource has no create-only
      # field, which is what makes compareScope: updatable a pure tightening here rather than a
      # rescue (see rd-orgruleset.yaml).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                target:
                  type: string
                  enum:
                    - branch
                    - tag
                    - push
                enforcement:
                  type: string
                  enum:
                    - disabled
                    - active
                    - evaluate
                bypass_actors:
                  type: array
                  items:
                    $ref: '#/components/schemas/BypassActor'
                conditions:
                  $ref: '#/components/schemas/Conditions'
                rules:
                  $ref: '#/components/schemas/Rules'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
    delete:
      summary: Delete an organization repository ruleset
      operationId: repos/delete-org-ruleset
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/ruleset_id'
      responses:
        '204':
          description: Response
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    org:
      name: org
      in: path
      required: true
      schema:
        type: string
    ruleset_id:
      name: ruleset_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    # bypass_actors, conditions and rules are $ref'd rather than inlined twice: create and
    # update take the identical structures, and `rules` alone is ~70 lines.
    BypassActor:
      type: object
      required:
        - actor_type
      properties:
        # Numeric id of the team / user / app / repository role. Omit it entirely for
        # OrganizationAdmin and DeployKey, which take no id.
        actor_id:
          type: integer
        actor_type:
          type: string
          enum:
            - Integration
            - OrganizationAdmin
            - RepositoryRole
            - Team
            - DeployKey
            - User
        bypass_mode:
          type: string
          enum:
            - always
            - pull_request
            - exempt
          default: always
    # Upstream this is a oneOf of three targeting styles — by repository NAME, by repository ID,
    # or by repository PROPERTY — each allOf'd with the shared ref_name condition. oasgen-provider
    # merges allOf but has no oneOf handling, so the union cannot be carried through to the CRD.
    #
    # Flattened to the repository_name variant ALONE, which is the one a declarative platform can
    # actually write: names and `~ALL` are stable, human-authored values.
    #   - repository_id     — dropped: it targets repositories by numeric id, which nothing in this
    #                         provider can resolve, and which changes meaning if a repo is recreated.
    #   - repository_property — dropped: it depends on org custom properties, a separate resource
    #                         this chart does not model, so a CR referencing one could not be
    #                         made self-consistent.
    # Both remain settable through the GitHub UI; a ruleset created there with either targeting
    # style is simply not manageable as an OrgRuleset CR.
    Conditions:
      type: object
      properties:
        ref_name:
          type: object
          properties:
            # `~DEFAULT_BRANCH` and `~ALL` are the two magic values; anything else is an fnmatch
            # pattern over full ref names (refs/heads/...).
            include:
              type: array
              items:
                type: string
            exclude:
              type: array
              items:
                type: string
        repository_name:
          type: object
          properties:
            # `~ALL` selects every repository in the org.
            include:
              type: array
              items:
                type: string
            exclude:
              type: array
              items:
                type: string
            # Whether renaming a targeted repository is prevented.
            protected:
              type: boolean
    # THE HARD TRIM — identical to assets/reporuleset.yaml, because GitHub uses the same
    # `repository-rule` schema at both levels. Upstream, `rules` is an array whose items are a
    # oneOf of 23 rule variants, each with its own `parameters` object. Two things make that
    # unusable verbatim:
    #
    #   1. oasgen-provider has no oneOf/anyOf handling at all (only allOf is merged), so a oneOf
    #      item schema reaches the generated CRD with no usable shape.
    #   2. Even flattened, several variants nest further unions — pull_request's
    #      `dismissal_restriction.allowed_actors` and `required_reviewers[].reviewer` are both
    #      actor unions of their own.
    #
    # So an item here is a flat {type, parameters} pair, and `parameters` is the UNION of the
    # parameter sets of the rule types below, every key optional. Which keys are legal depends on
    # `type`; GitHub 422s on a mismatch rather than ignoring it, which is the correct and loud
    # failure. Set only the keys belonging to the type you chose.
    #
    # "every key optional" is a property of THIS union, not of GitHub. Flattening the oneOf drops
    # each variant's own `required` list, so the CRD cannot enforce it: a PARTIAL `parameters`
    # object passes admission and is then rejected by the API. Once `parameters` is present, send
    # the complete set for that type —
    #   pull_request           required_approving_review_count, dismiss_stale_reviews_on_push,
    #                          require_code_owner_review, require_last_push_approval,
    #                          required_review_thread_resolution  (all five; allowed_merge_methods
    #                          is the only optional extra)
    #   required_status_checks required_status_checks, strict_required_status_checks_policy
    #                          (do_not_enforce_on_create is optional)
    #   update                 update_allows_fetch_and_merge
    #   required_deployments   required_deployment_environments
    #   merge_queue            check_response_timeout_minutes, grouping_strategy,
    #                          max_entries_to_build, max_entries_to_merge, merge_method,
    #                          min_entries_to_merge, min_entries_to_merge_wait_minutes (all seven;
    #                          GitHub requires the whole set together)
    #   *_pattern (the five)   operator, pattern (required pair); name, negate (optional)
    #   workflows              workflows[] (each: repository_id, path required; ref, sha optional);
    #                          do_not_enforce_on_create optional. Needs target: branch.
    #   code_scanning          code_scanning_tools[] (each: tool, security_alerts_threshold,
    #                          alerts_threshold — all required). Needs target: branch.
    #   copilot_code_review    review_draft_pull_requests, review_on_push (both optional)
    #   file_path_restriction      restricted_file_paths (required); ignored_file_paths (optional)
    #   file_extension_restriction restricted_file_extensions (required)
    #   max_file_path_length       max_file_path_length (required; GitHub range 1-32767)
    #   max_file_size              max_file_size (required, MB; GitHub range 1-100);
    #                              ignored_file_paths (optional)
    # The four file_*/max_* are PUSH-target rules: valid only on a ruleset whose target is `push`;
    # GitHub 422s them on a branch/tag ruleset.
    # The parameterless types — creation, deletion, non_fast_forward, required_linear_history,
    # required_signatures, license_compliance_scanning — take no `parameters` key at all.
    #
    # MODELLED — all of GitHub's 23 rule types are now modelled:
    #   creation, deletion, update, non_fast_forward, required_linear_history,
    #   required_signatures, pull_request, required_status_checks, required_deployments,
    #   merge_queue, commit_message_pattern, commit_author_email_pattern,
    #   committer_email_pattern, branch_name_pattern, tag_name_pattern,
    #   workflows, code_scanning, copilot_code_review, license_compliance_scanning,
    #   file_path_restriction, max_file_path_length, file_extension_restriction, max_file_size.
    #
    # On the five *_pattern rules, and the "name/pattern would collide" note this comment used to
    # carry: there is NO collision, and it was removed after checking the generator source. Those
    # keys live at rules[].parameters.{name,pattern} — two levels below the ruleset's own
    # top-level `name` — and oasgen's ONLY name-merge logic (addParametersToSpec, #108/#257)
    # reconciles a ROOT-level body property against a path/query/header PARAMETER of the same
    # name; it never walks nested body keys and never merges body-to-body. A property literally
    # named `pattern` is read from the `properties` map by its key and is a different thing from
    # the `pattern` validation keyword (libopenapi_adapter populates Properties and Pattern from
    # separate inputs). Verified against oasgen 0.43.0 (what clusters run) and current, and by
    # generating the CRD and validating sample CRs. So the five pattern rules and merge_queue are
    # modelled as plain additional optional keys in the same union.
    #
    # NOTHING is left out at the rule-type level any more — the former "LEFT OUT" set (workflows,
    # code_scanning, copilot_code_review, license_compliance_scanning, and the four push rules) is
    # modelled above. Two usage caveats remain:
    #   - workflows / code_scanning reference other GitHub products by identifier — a workflow by
    #     repository_id + path, a code-scanning tool by name — which the author must hand-supply;
    #     the provider cannot resolve them. They are EXPRESSIBLE, just not convenient.
    #   - the four push rules require the ruleset's target: push (see the PUSH-target note above).
    #
    #   Within pull_request, dismissal_restriction and required_reviewers are still dropped for
    #   reason (2) above; required_reviewers is additionally still in beta upstream.
    Rules:
      type: array
      items:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - creation
              - update
              - deletion
              - non_fast_forward
              - required_linear_history
              - required_signatures
              - pull_request
              - required_status_checks
              - required_deployments
              - merge_queue
              - commit_message_pattern
              - commit_author_email_pattern
              - committer_email_pattern
              - branch_name_pattern
              - tag_name_pattern
              - workflows
              - code_scanning
              - copilot_code_review
              - license_compliance_scanning
              - file_path_restriction
              - max_file_path_length
              - file_extension_restriction
              - max_file_size
          parameters:
            type: object
            properties:
              # type: update
              update_allows_fetch_and_merge:
                type: boolean
              # type: pull_request
              required_approving_review_count:
                type: integer
              dismiss_stale_reviews_on_push:
                type: boolean
              require_code_owner_review:
                type: boolean
              require_last_push_approval:
                type: boolean
              required_review_thread_resolution:
                type: boolean
              allowed_merge_methods:
                type: array
                items:
                  type: string
                  enum:
                    - merge
                    - squash
                    - rebase
              # type: required_status_checks
              strict_required_status_checks_policy:
                type: boolean
              do_not_enforce_on_create:
                type: boolean
              required_status_checks:
                type: array
                items:
                  type: object
                  required:
                    - context
                  properties:
                    # The check's name as it appears on a commit, e.g. "security / sbom".
                    context:
                      type: string
                    integration_id:
                      type: integer
              # type: required_deployments
              required_deployment_environments:
                type: array
                items:
                  type: string
              # type: merge_queue — all seven keys are required together by GitHub; the flattened
              # union cannot enforce that, so a partial set is a 422 (loud), not a silent ignore.
              # GitHub also range-checks the integers (timeouts 1-360 / 0-360, entry counts 0-100);
              # those bounds are left to the API rather than duplicated as CRD constraints.
              # CONSTRAINT (verified live 2026-11-03): a ruleset carrying a merge_queue rule must
              # target a CONCRETE ref — its conditions.ref_name must NOT be a wildcard such as ~ALL,
              # or GitHub 422s "Wildcard ref names are not supported when merge queue is enabled".
              # Use refs/heads/<branch> or ~DEFAULT_BRANCH.
              check_response_timeout_minutes:
                type: integer
                description: >-
                  merge_queue parameter. All seven merge_queue keys are required together.
                  A ruleset carrying a merge_queue rule must target a concrete ref: its
                  conditions.ref_name must not be a wildcard such as ~ALL (GitHub returns 422
                  "Wildcard ref names are not supported when merge queue is enabled"). Use
                  refs/heads/<branch> or ~DEFAULT_BRANCH.
              grouping_strategy:
                type: string
                enum:
                  - ALLGREEN
                  - HEADGREEN
              max_entries_to_build:
                type: integer
              max_entries_to_merge:
                type: integer
              merge_method:
                type: string
                enum:
                  - MERGE
                  - SQUASH
                  - REBASE
              min_entries_to_merge:
                type: integer
              min_entries_to_merge_wait_minutes:
                type: integer
              # types: commit_message_pattern, commit_author_email_pattern,
              # committer_email_pattern, branch_name_pattern, tag_name_pattern — the five share one
              # {name, negate, operator, pattern} shape. `operator` and `pattern` are the required
              # pair; `name` (a human label for the rule) and `negate` are optional. `name` here is
              # the pattern rule's own label at rules[].parameters.name — NOT the ruleset's
              # top-level `name`, and it cannot collide with it (see the comment above).
              name:
                type: string
              negate:
                type: boolean
              operator:
                type: string
                enum:
                  - starts_with
                  - ends_with
                  - contains
                  - regex
              pattern:
                type: string
              # type: workflows — `workflows` (array) required; do_not_enforce_on_create (declared
              # above) optional. Each entry references an Actions workflow file by numeric
              # repository_id + path (ref/sha optional). Needs the ruleset's target: branch.
              workflows:
                type: array
                items:
                  type: object
                  required:
                    - repository_id
                    - path
                  properties:
                    repository_id:
                      type: integer
                    path:
                      type: string
                    ref:
                      type: string
                    sha:
                      type: string
              # type: code_scanning — `code_scanning_tools` (array) required; each entry names a
              # tool (e.g. CodeQL) and both alert thresholds. Needs the ruleset's target: branch.
              code_scanning_tools:
                type: array
                items:
                  type: object
                  required:
                    - tool
                    - security_alerts_threshold
                    - alerts_threshold
                  properties:
                    tool:
                      type: string
                    security_alerts_threshold:
                      type: string
                      enum:
                        - none
                        - critical
                        - high_or_higher
                        - medium_or_higher
                        - all
                    alerts_threshold:
                      type: string
                      enum:
                        - none
                        - errors
                        - errors_and_warnings
                        - all
              # type: copilot_code_review — both keys optional.
              review_draft_pull_requests:
                type: boolean
              review_on_push:
                type: boolean
              # types: push-target rules — valid ONLY on a ruleset whose target is `push`; GitHub
              # 422s them on a branch/tag ruleset. GitHub range-checks the integers
              # (max_file_path_length 1-32767; max_file_size 1-100 MB); left to the API.
              #   file_path_restriction      restricted_file_paths (required); ignored_file_paths (optional)
              #   file_extension_restriction restricted_file_extensions (required)
              #   max_file_path_length       max_file_path_length (required)
              #   max_file_size              max_file_size (required); ignored_file_paths (optional)
              restricted_file_paths:
                type: array
                items:
                  type: string
              ignored_file_paths:
                type: array
                items:
                  type: string
              restricted_file_extensions:
                type: array
                items:
                  type: string
              max_file_path_length:
                type: integer
              max_file_size:
                type: integer
    # Response schema. It carries the fields the status is built from and nothing else: drift
    # comparison reads the LIVE response body, never this schema, so `rules`, `conditions` and
    # `bypass_actors` need no response-side declaration and are not duplicated here.
    Ruleset:
      type: object
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        target:
          type: string
          # `repository` appears HERE but not in the request enums above, and — unlike the
          # repo-level twin, where GitHub genuinely rejects it on the request — that is a
          # deliberate trim, not an API limit: POST/PUT /orgs/{org}/rulesets DO accept
          # `target: repository` (a repository-policy ruleset, which governs repo creation and
          # naming rather than refs). It is not offered because such a ruleset has a different
          # shape end to end — its rules are repository-property rules, none of which are
          # modelled below, and its `conditions` must NOT carry `ref_name`. Exposing the value
          # without that shape would only let a user assemble a ruleset GitHub rejects.
          #
          # It MUST still be listed here — status.target takes its schema from this property,
          # and an enum that cannot hold what GitHub returns would make the status write fail.
          enum:
            - branch
            - tag
            - push
            - repository
        # Always `Organization` for this kind; kept for symmetry with RepoRuleset, where the same
        # endpoint shape can also report an inherited ruleset.
        source_type:
          type: string
          enum:
            - Repository
            - Organization
            - Enterprise
        source:
          type: string
        enforcement:
          type: string
          enum:
            - disabled
            - active
            - evaluate
        created_at:
          type: string
        updated_at:
          type: string
security:
  - accessToken: []
