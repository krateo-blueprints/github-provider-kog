openapi: 3.0.3
info:
  version: 2022-11-28
  title: GitHub v3 REST API - Pull Requests
servers:
  - url: https://api.github.com
paths:
  "/repos/{owner}/{repo}/pulls":
    post:
      summary: Create a pull request
      operationId: pulls/create
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                head:
                  type: string
                base:
                  type: string
                title:
                  type: string
                body:
                  type: string
                draft:
                  type: boolean
                # CREATE-ONLY, measured live on 2026-11-10 (throwaway repo in krateo-blueprints): on a
                # same-repo pull request GitHub stores `false` whatever is sent, and a PATCH to `true` is
                # refused with 422 "Fork collab can only be enabled on cross-repo pull requests". In the
                # update body a CR setting `true` on a same-repo PR would 422 on every reconcile, so it
                # stays out of the PATCH body below (deviation review row 22).
                maintainer_can_modify:
                  type: boolean
                # As GitHub's create body publishes them (deviation review row 20). Neither is in the
                # PATCH body, so both act once, at create. With `issue`, GitHub converts that issue into
                # the pull request and takes its title and body, which is why `title` is not required.
                # `head` is an identifier, and findby matches it against the normalized response, which
                # for a cross-repository PR (what `head_repo` creates) is the label "owner:branch". A
                # `head` written as a bare branch will not match there, so recovery by findby fails for it.
                head_repo:
                  type: string
                  description: The name of the repository where the changes in the pull request were made.
                    This field is required for cross-repository pull requests if both repositories are
                    owned by the same organization.
                  format: repo.nwo
                issue:
                  type: integer
                  description: An issue in the repository to convert to a pull request. The issue title,
                    body, and comments will become the title, body, and comments on the new pull request.
                    Required unless `title` is specified.
                  format: int64
              # GitHub requires only head and base: `title` is required unless `issue` is given, a
              # cross-field rule a CRD cannot express (oasgen-provider#396), so neither is required here.
              required:
                - head
                - base
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
    get:
      # List PRs — the findby target (#14). The controller lists this and matches the item whose
      # head AND base equal spec.head/spec.base, after the findby verb's responseTransform flattens
      # each item's head/base objects to branch strings (rd-pullrequest.yaml). state/per_page are
      # injected by the findby verb's static queries, not required here.
      summary: List pull requests
      operationId: pulls/list
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequest'
  "/repos/{owner}/{repo}/pulls/{pull_number}":
    get:
      # The controller does NOT see this body as GitHub sends it: the get verb in
      # rd-pullrequest.yaml carries a responseTransform that replaces head/base with their
      # branch-name strings before status population and drift comparison. head/base are declared
      # as strings in the PullRequest schema below because they are identifiers (#14) and so are
      # projected into the status schema.
      summary: Get a pull request
      operationId: pulls/get
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/pull_number'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
    patch:
      summary: Update a pull request
      operationId: pulls/update
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/pull_number'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
                # GitHub enumerates open|closed. Update-only, so not settable from a CR yet (oasgen #491).
                state:
                  type: string
                  enum:
                    - open
                    - closed
                base:
                  type: string
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
  parameters:
    owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    pull_number:
      name: pull_number
      in: path
      required: true
      schema:
        type: string
  schemas:
    PullRequest:
      type: object
      properties:
        number:
          type: integer
        id:
          type: integer
        node_id:
          type: string
        html_url:
          type: string
        state:
          type: string
        title:
          type: string
        # head/base are branch STRINGS in the CR domain. GitHub returns them as objects on every
        # response; every verb's responseTransform (rd-pullrequest.yaml) flattens them to .ref
        # (or .label for a cross-repo head) BEFORE status is written, so the string type here is
        # what status actually carries. They are identifiers (#14), so the generator projects them
        # into the status schema from this declaration.
        head:
          type: string
        base:
          type: string
        merged:
          type: boolean
        # RFC3339 timestamp of the merge, or null for an open or closed-but-unmerged PR. GitHub
        # returns it on the same create 201 / get 200 / update 200 responses as `merged`.
        merged_at:
          type: string
security:
  - accessToken: []
