apiVersion: v2
name: github-provider-kog
description: >-
  Krateo KOG provider (oasgen-provider >= 0.23.0) exposing GitHub's platform-engineering
  API — repositories, teams, memberships, webhooks, environments, rulesets, Actions
  variables, branch protection and more — as 29 github.krateo.io Kubernetes kinds. Every
  kind is native: the chart ships only RestDefinitions + trimmed OpenAPI specs, with no
  controller image and no proxy plugin.
type: application

# release-oci substitutes CHART_VERSION from the pushed semver tag.
version: CHART_VERSION
# No provider image is shipped (the git-write kinds are OAS-only; oasgen spawns the
# rest-dynamic-controller). appVersion tracks the OpenAPI/mapping revision.
appVersion: "0.1.1"

keywords:
  - krateo
  - kog
  - oasgen-provider
  - github
  - blueprint-authoring
home: https://github.com/krateo-blueprints/github-provider-kog
sources:
  - https://github.com/krateo-blueprints/github-provider-kog
