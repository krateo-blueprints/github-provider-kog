apiVersion: v2
name: github-provider-kog
description: >-
  Krateo KOG provider (oasgen-provider >= 0.76.0, not 0.77.0) exposing GitHub's platform-engineering
  API — repositories, teams, memberships, webhooks, environments, rulesets, Actions
  variables, branch protection, git references, file contents and more — as 32 github.krateo.io
  Kubernetes kinds. Every kind is native: the chart ships only RestDefinitions + trimmed OpenAPI specs,
  with no controller image and no proxy plugin.
type: application

# release-oci substitutes CHART_VERSION from the pushed semver tag.
version: CHART_VERSION
# No provider image is shipped (the git-write kinds are OAS-only; oasgen spawns the
# rest-dynamic-controller), so there is no separate app version: appVersion is the chart version,
# stamped from the same tag (krateo-blueprints/charts REPOSITORY.md R4).
appVersion: "CHART_VERSION"

keywords:
  - krateo
  - kog
  - oasgen-provider
  - github
  - blueprint-authoring
home: https://github.com/krateo-blueprints/github-provider-kog
# The oasgen-provider requirement, machine-readable. The Krateo installer's floor gate
# (check-chart-requires-floors.py) reads krateo.io/requires-<COMPONENT> from every pinned chart and
# refuses a pin whose oasgen-provider version violates it, failing closed on anything it cannot parse.
# The key names the installer COMPONENT (oasgen-provider), not a chart. Keep it equal to the floor in
# `description` and the README: hack/assert-drift-invariants.py fails CI when they disagree.
# >= 0.76.0: below it Issue, RepoDeployment and a draft Release can duplicate on GitHub (#746).
# != 0.77.0: a create whose outcome is unknown shows Creating forever instead of CreateOutcomeUnknown (#758).
annotations:
  krateo.io/requires-oasgen-provider: ">= 0.76.0, != 0.77.0"
sources:
  - https://github.com/krateo-blueprints/github-provider-kog
