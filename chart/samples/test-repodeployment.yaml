# Record a deployment of `main` to the staging environment.
#
# A deployment is an immutable record: GitHub has no update endpoint for one, so editing
# this CR's spec will NOT change the deployment (the RestDefinition uses compareScope
# `identifiersAndStatus` for exactly that reason). To deploy again, apply a new CR.
#
# Kind is `RepoDeployment` (not `Deployment`): a `Deployment` kind collides with k8s apps/v1
# and oasgen-provider refuses to create its CRD on a fresh cluster. Same GitHub Deployments API.
#
# `auto_merge: false` is spelled out here for readability, but it is also the CRD default
# (assets/deployment.yaml pins it, deliberately against GitHub's own default of true):
# left true, GitHub responds to a ref that is behind the default branch by merging instead
# of deploying, answering 202 with a bare message and no deployment — so no id, so status
# never populates and the resource is never observable.
#
# `required_contexts: []` is NOT defaulted and does matter: it bypasses commit-status
# checking. Omit it and GitHub verifies every unique context and answers 409 while any is
# failing or pending — a loud failure, which is the right default to leave alone.
apiVersion: github.krateo.io/v2022-11-28
kind: RepoDeployment
metadata:
  name: test-demo-deployment
  namespace: krateo-system
spec:
  configurationRef:
    name: github-blueprints-config
  owner: krateo-blueprints
  repo: demo-destination
  ref: main
  task: deploy
  environment: staging
  description: "Deployment recorded by Krateo"
  auto_merge: false
  required_contexts: []
  transient_environment: false
  production_environment: false
