# Create the DESTINATION repository a blueprint will then be written into.
#
# Order matters: a Repository must exist (and be initialised) before a GitRef or RepoContent
# aimed at it can succeed. `auto_init` defaults to true in the OAS precisely so the new repo
# has a first commit and therefore a default branch — without one, GitRef has no base sha to
# branch from and RepoContent has nothing to commit against.
apiVersion: github.krateo.io/v2022-11-28
kind: Repository
metadata:
  name: test-demo-destination
  namespace: krateo-system
spec:
  configurationRef:
    name: github-blueprints-config
  org: krateo-blueprints
  name: demo-destination
  description: "Destination repository created by Krateo"
  # CREATE-ONLY in effect: `private` is deliberately out of the PATCH body, so making this
  # repository public in GitHub afterwards is NOT reverted by the next reconcile — and editing
  # this field on the applied CR does nothing either. Change exposure in GitHub, not here (#11).
  private: true
  auto_init: true
