# Create a branch. `sha` (the commit to branch from) is OPTIONAL: leave it out and the
# provider resolves the repo's default-branch (e.g. main) HEAD sha automatically — so an
# author never needs to know a commit sha. Set `sha` only to branch off a specific commit.
apiVersion: github.krateo.io/v1alpha1
kind: GitRef
metadata:
  name: test-builder-branch
  namespace: krateo-system
  annotations:
    krateo.io/connector-verbose: "true"
spec:
  configurationRef:
    name: github-blueprints-config
  owner: braghettos
  repo: krateo-blueprints
  ref: refs/heads/builder/demo-branch
  # sha: <optional — omit to branch off the default branch HEAD>
