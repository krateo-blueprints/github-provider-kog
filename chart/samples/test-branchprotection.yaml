# Protect the default branch of a Krateo destination repository.
#
# Order matters: the Repository (and the branch itself) must exist first — GitHub answers 404 to a
# protection PUT against a branch that has no commits, which is why Repository defaults auto_init
# to true.
#
# Omitted controls mean OFF: the create/update requestTransform sends the explicit nulls GitHub
# requires for required_status_checks, enforce_admins, required_pull_request_reviews and
# restrictions. Here only the first three are set, so pushes stay unrestricted.
#
# `restrictions` is org-only, and both it and `contexts` must be written SORTED — the drift
# comparison is order-sensitive and the observed lists come back sorted.
apiVersion: github.krateo.io/v1alpha1
kind: BranchProtection
metadata:
  name: test-demo-destination-main
  namespace: krateo-system
  annotations:
    krateo.io/connector-verbose: "true"
spec:
  configurationRef:
    name: github-blueprints-config
  owner: krateo-blueprints
  repo: demo-destination
  branch: main
  required_status_checks:
    strict: true
    contexts:
      - build
      - lint
  required_pull_request_reviews:
    dismiss_stale_reviews: true
    require_code_owner_reviews: true
    required_approving_review_count: 1
  enforce_admins: false
  required_linear_history: true
  allow_force_pushes: false
  allow_deletions: false
