# A deployment environment gating the production deploy job.
#
# `custom_branch_policies: true` is what makes the DeploymentBranchPolicy sample next to this
# one possible: without it, that POST returns 404. The two booleans must disagree — GitHub 422s
# if both are true or both are false. Omit the whole `deployment_branch_policy` object to let
# every branch deploy.
#
# `reviewers` takes NUMERIC user/team ids, not logins; leave it out unless you have them. Set
# `prevent_self_review: true` only together with a non-empty `reviewers` list: GitHub stores that
# flag inside the required-reviewers rule, so without reviewers nothing is stored and the CR
# re-applies forever. Fields set here are observed, so an out-of-band change to them is reverted
# on the next reconcile; a field left out is not touched (see rd-environment.yaml).
apiVersion: github.krateo.io/v2022-11-28
kind: Environment
metadata:
  name: test-demo-production
  namespace: krateo-system
spec:
  configurationRef:
    name: github-blueprints-config
  owner: krateo-blueprints
  repo: demo-destination
  environment_name: production
  wait_timer: 5
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies: true
