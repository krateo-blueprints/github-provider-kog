# The PAT wiring each resource CR references via spec.configurationRef. Provision
# out-of-band (never via the portal write-path). First create the token Secret:
#
#   kubectl create secret generic gh-token -n krateo-system \
#     --from-literal=token=<YOUR_GITHUB_PAT>   # scopes: repo (contents/refs/pulls write)
#                                            # + the org must allow the token to CREATE repos
#                                            #   (classic: `repo`; fine-grained: org
#                                            #   "Administration: read & write") — needed by Repository
#
# Then one <Kind>Configuration per kind, each pointing at that Secret. oasgen 0.9.x
# generates these Configuration CRDs from the OAS securityScheme and auto-adds a
# spec.configurationRef field to every resource CR. All of them may share a name (the
# kind is implied by the resource that references it) — which is why all 29 below carry
# the same `github-blueprints-config`, and why one PAT can drive the whole chart.
#
# You only need the Configuration for the kinds you actually use; the rest are inert.
---
apiVersion: github.krateo.io/v1alpha1
kind: RepositoryConfiguration
metadata:
  name: github-blueprints-config
  namespace: krateo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: gh-token
        namespace: krateo-system
        key: token
---
