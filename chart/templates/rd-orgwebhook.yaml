{{- if include "github-provider-kog.kindEnabled" (list . "OrgWebhook") -}}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-orgwebhook
  namespace: {{ .Release.Namespace }}
spec:
  {{- include "github-provider-kog.serverURL" . | nindent 2 }}
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-orgwebhook/orgwebhook.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: OrgWebhook
    # GitHub assigns the hook id on create; `org` only scopes it. `id` is a property of the GET
    # response (schemas/OrgWebhook), so status.id is populated on the first successful observe.
    identifiers:
      - id
    # Org hooks have no test_url (that is repository-only); the rest matches RepoWebhook.
    additionalStatusFields:
      - url
      - ping_url
      - deliveries_url
      - created_at
      - updated_at
    # hook_id is a path parameter on get/update/delete only. oasgen merges parameters from every
    # verb into the spec, but omits one that a mapping supplies, and the requestFieldMapping below
    # supplies this one, so it is not a spec field. The excludedSpecFields entry below is redundant
    # for the schema (on oasgen 0.71.0 the CRD renders identically without it) but not inert:
    # without it, oasgen warns on every generation that the mapping omits the parameter, which lands
    # in status.schemaWarnings and a Warning event. It is kept because it keeps that warning out,
    # and it records the intent that the id is never author-supplied. What actually fills the path
    # parameter is the requestFieldMapping below, which sources it from status.id. Same pattern as
    # PullRequest's pull_number.
    excludedSpecFields:
      - hook_id
    # DELIBERATE, for the same reason as RepoWebhook — see rd-repowebhook.yaml for the full
    # argument. In short: GitHub echoes config.secret as the mask "********", so under the
    # default `fullSpec` the hook would read as permanently drifted and be PATCHed on every
    # reconcile without ever converging. assets/orgwebhook.yaml keeps `secret` (and the
    # create-only `name`) out of the update body, so `updatable` compares exactly config.url,
    # config.content_type, config.insecure_ssl, events and active — the fixable set — while the
    # secret still rides along on any PATCH, because the request body is assembled by top-level
    # key and carries the whole `config` map.
    #
    # Ownership note: GitHub replaces `config` wholesale, so the CR is AUTHORITATIVE for
    # config.secret — a secret set out-of-band is CLEARED on the next config PATCH (and org hooks
    # also drop unmodelled config.username/password). See docs/configuration.md
    # "Updates send whole values — what a CR owns".
    #
    # NOT partialFields: [config], for the reason in rd-repowebhook.yaml: GitHub stores the
    # masked "********" the pre-update read returns as the new secret.
    compareScope: updatable
    configurationFields: []
    verbsDescription:
      - action: create
        method: POST
        path: /orgs/{org}/hooks
      - action: get
        method: GET
        path: /orgs/{org}/hooks/{hook_id}
        requestFieldMapping:
          - inPath: hook_id
            inCustomResource: status.id
      - action: update
        method: PATCH
        path: /orgs/{org}/hooks/{hook_id}
        requestFieldMapping:
          - inPath: hook_id
            inCustomResource: status.id
      - action: delete
        method: DELETE
        path: /orgs/{org}/hooks/{hook_id}
        requestFieldMapping:
          - inPath: hook_id
            inCustomResource: status.id
{{- end }}
