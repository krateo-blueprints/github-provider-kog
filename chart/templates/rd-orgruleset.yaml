apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-orgruleset
  namespace: {{ .Release.Namespace }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-orgruleset/orgruleset.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: OrgRuleset
    # As with RepoRuleset: `name` is not unique, so the server-assigned id is the only identity.
    # It is a property of the GET response schema and binds the item path.
    identifiers:
      - id
    additionalStatusFields:
      - node_id
      - name
      - target
      - source_type
      - source
      - enforcement
      - created_at
      - updated_at
    # ruleset_id is a path parameter on get/update/delete only. oasgen merges parameters from every
    # verb into the spec, but omits one that a mapping supplies, and the requestFieldMapping below
    # supplies this one, so it is not a spec field. The excludedSpecFields entry below is a
    # redundant no-op (oasgen warns it is not in the schema), kept because excludedSpecFields is
    # oasgen-immutable (#290) and it records the intent that the id is never author-supplied;
    # get/update/delete source the path parameter from status.id via the requestFieldMapping below.
    excludedSpecFields:
      - ruleset_id
    compareScope: updatable
    # ^ Same reasoning as rd-reporuleset.yaml: the update body carries every create field, so
    # this is a tightening rather than a rescue. It keeps the `org` path parameter out of the
    # drift comparison by construction, and the array-ordering caveat there applies here too —
    # `rules` and `bypass_actors` are compared element-by-element in order. Verified live
    # 2026-11-03 on a throwaway public repo (since deleted): order preserved, casing verbatim,
    # GitHub-added keys skipped, and stable on re-PUT — 0 drift for every modelled type, merge_queue
    # and the five *_pattern rules included. The defaults GitHub fills for omitted optional keys
    # (e.g. a pattern rule's `negate: false`, `name`) are never compared, because the comparator
    # walks only the CR's keys (see rd-reporuleset.yaml; comparison.go:43, skip at :47-53), so none
    # introduces a permanent drift loop.
    #
    # Ownership note: the PUT re-sends the WHOLE `rules` array (org-wide), so a UI-added rule of one
    # of the 8 still-unmodelled rule types is DELETED on reconcile. See docs/configuration.md
    # "Updates send whole values — what a CR owns".
    configurationFields: []
    verbsDescription:
      - action: create
        method: POST
        path: /orgs/{org}/rulesets
      - action: get
        method: GET
        path: /orgs/{org}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /orgs/{org}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
      - action: delete
        method: DELETE
        path: /orgs/{org}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
