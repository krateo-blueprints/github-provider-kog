{{- if include "github-provider-kog.kindEnabled" (list . "Workflow") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-workflow
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, unlike configmap-repocontent / configmap-gitref / configmap-pullrequest.
  # Those three carry a per-operation `servers` override pointing at the plugin, so their asset has
  # to resolve a template. Workflow is fully native — every verb goes straight to api.github.com —
  # so the asset is copied verbatim and contains no template action.
  workflow.yaml: |
{{ .Files.Get "assets/workflow.yaml" | indent 4 }}
{{- end }}
