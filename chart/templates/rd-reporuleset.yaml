{{- if include "github-provider-kog.kindEnabled" (list . "RepoRuleset") -}}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-reporuleset
  namespace: {{ .Release.Namespace }}
spec:
  {{- include "github-provider-kog.serverURL" . | nindent 2 }}
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-reporuleset/reporuleset.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: RepoRuleset
    # A ruleset has no natural key: GitHub allows two rulesets with the same `name` on the same
    # repository, so only the server-assigned id identifies one. `id` is a property of the GET
    # response schema and is what the item path is bound from.
    identifiers:
      - id
    additionalStatusFields:
      - node_id
      - name
      - target
      - source_type
      - source
      - enforcement
      - created_at
      - updated_at
    # ruleset_id is a path parameter on get/update/delete only. oasgen merges parameters from every
    # verb into the spec, but omits one that a mapping supplies, and the requestFieldMapping below
    # supplies this one, so it is not a spec field. The excludedSpecFields entry below is a
    # redundant no-op (oasgen warns it is not in the schema), kept because excludedSpecFields is
    # oasgen-immutable (#290) and it records the intent that the id is never author-supplied;
    # get/update/delete source the path parameter from status.id via the requestFieldMapping below.
    excludedSpecFields:
      - ruleset_id
    compareScope: updatable
    # ^ The update body carries every create field (name, target, enforcement, bypass_actors,
    # conditions, rules), so `updatable` and `fullSpec` compare the same ruleset content
    # today. `owner` and `repo` are not the difference between them: they are path parameters
    # the response never carries, and the comparison SKIPS any spec key absent from the
    # response (`rmValue, ok := rm[key]; if !ok { continue }`), under either scope. So this is
    # defensive — it states the intent, and stays correct if a field the PUT cannot express is
    # added to this OAS later.
    #
    # The genuine drift risk is the other kind, and no scope filters it out: `rules`,
    # `bypass_actors` and `conditions.ref_name.include`/`exclude` are arrays the response DOES
    # carry, and the comparator walks them BY INDEX. The same set returned in GitHub's own
    # order reads as drift, and the PUT re-sends the CR's order without settling it — so list
    # them in a stable order. Extra keys GitHub adds inside a rule's `parameters` (defaults it
    # fills in, e.g. do_not_enforce_on_create) are ignored — the comparison only walks keys the
    # CR declares — so a partially-specified rule does not read as drift. That "walks only the
    # CR's keys" guarantee is the comparator ranging over the CR map: krateo-rest-dynamic-controller
    # internal/tools/comparison/comparison.go:43 (`for key, value := range mg`), skipping any
    # response-only key at :47-53. Verified live 2026-11-03 on a throwaway public repo (since
    # deleted): the `rules` array came back in the EXACT submit order, casing was verbatim
    # (merge_method SQUASH, grouping_strategy HEADGREEN, the operators, and pattern strings
    # including regex escapes), the GitHub-added keys were skipped by the comparator (a pattern
    # rule's `negate: false` and empty `name` where the CR omitted them; pull_request's
    # response-only `required_reviewers`/`dismissal_restriction`), and a second PUT+GET was
    # byte-identical — 0 drift across all modelled types, merge_queue and the five *_pattern rules
    # included. (The merge_queue `parameters` object came back with its keys reordered, but it is a
    # map, compared key-by-key, so order there does not matter.)
    #
    # Ownership note: the PUT re-sends the WHOLE `rules` array, so a UI-added rule of one of the 8
    # still-unmodelled rule types on this CR-managed ruleset is DELETED on the next reconcile (the
    # CR cannot express it). See docs/configuration.md "Updates send whole values — what a CR owns".
    configurationFields: []
    verbsDescription:
      - action: create
        method: POST
        path: /repos/{owner}/{repo}/rulesets
      - action: get
        method: GET
        path: /repos/{owner}/{repo}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /repos/{owner}/{repo}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
      - action: delete
        method: DELETE
        path: /repos/{owner}/{repo}/rulesets/{ruleset_id}
        requestFieldMapping:
          - inPath: ruleset_id
            inCustomResource: status.id
{{- end }}
