apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-orgmembership
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, like configmap-repository. OrgMembership is fully native — every verb goes
  # straight to api.github.com — so the asset is copied verbatim and contains no template action.
  # Only the plugin-backed kinds need `tpl`.
  orgmembership.yaml: |
{{ .Files.Get "assets/orgmembership.yaml" | indent 4 }}
