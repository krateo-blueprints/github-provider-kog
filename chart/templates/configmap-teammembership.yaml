apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-teammembership
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, like configmap-repository.yaml and unlike configmap-repocontent /
  # configmap-gitref / configmap-pullrequest. Those three carry a per-operation `servers` override
  # pointing at the plugin, so their asset has to resolve a template. This kind is fully native —
  # every verb goes straight to api.github.com — so the asset is copied verbatim and contains no
  # template action.
  teammembership.yaml: |
{{ .Files.Get "assets/teammembership.yaml" | indent 4 }}
