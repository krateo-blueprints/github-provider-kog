{{- if include "github-provider-kog.kindEnabled" (list . "BranchProtection") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-branchprotection
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, unlike configmap-repocontent / configmap-gitref / configmap-pullrequest.
  # Those three carry a per-operation `servers` override pointing at the plugin, so their asset
  # has to resolve a template. BranchProtection is fully native — the response asymmetry that
  # would have needed a plugin is closed by the get verb's responseTransform in
  # rd-branchprotection.yaml — so the asset is copied verbatim and contains no template action.
  branchprotection.yaml: |
{{ .Files.Get "assets/branchprotection.yaml" | indent 4 }}
{{- end }}
