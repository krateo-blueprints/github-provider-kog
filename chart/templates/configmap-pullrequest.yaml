apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pullrequest
  namespace: {{ .Release.Namespace }}
data:
  # tpl-rendered so the get-operation `servers` override resolves {{ `{{ include "webServiceUrl" . }}` }}
  # to the plugin's in-cluster URL (PR observe flattens head/base → ref strings). Matches
  # configmap-repocontent / configmap-gitref.
  pullrequest.yaml: |
{{ tpl (.Files.Get "assets/pullrequest.yaml") . | indent 4 }}
