{{- if include "github-provider-kog.kindEnabled" (list . "PullRequest") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pullrequest
  namespace: {{ .Release.Namespace }}
data:
  # Plain .Files.Get, like every other kind in this chart. The pre-0.2.2 version of this file was
  # `tpl`-rendered because the asset carried a per-operation `servers:` override pointing at the
  # proxy plugin; the plugin is gone and so is the override, so there is no template action left
  # to resolve. A leftover `tpl` would be harmless, a leftover `servers:` would be fatal.
  pullrequest.yaml: |
{{ .Files.Get "assets/pullrequest.yaml" | indent 4 }}
{{- end }}
