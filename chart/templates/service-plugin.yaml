apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-provider-kog.pluginName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "github-provider-kog.pluginName" . }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "github-provider-kog.pluginName" . }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
