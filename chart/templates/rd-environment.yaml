apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-environment
  namespace: {{ .Release.Namespace }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-environment/environment.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: Environment
    # `name` is the environment name as GitHub returns it — the response-side counterpart of the
    # `environment_name` path parameter, and a property of the GET response schema. There is no
    # server-assigned key to carry in the path, so unlike PullRequest this kind needs no
    # excludedSpecFields / requestFieldMapping: every verb addresses the environment by the same
    # three spec fields.
    identifiers:
      - name
    additionalStatusFields:
      - id
      - node_id
      - html_url
      - created_at
      - updated_at
    compareScope: updatable
    # ^ The create verb and the update verb are the SAME PUT operation, so the updatable set is
    # exactly the resource's desired-state body: wait_timer, prevent_self_review, reviewers and
    # deployment_branch_policy.{protected_branches,custom_branch_policies}. There are no
    # create-only fields to drop, which is why this is not the drift-loop rescue it is on
    # DeploymentBranchPolicy — it is the by-construction correct scope.
    #
    # What it buys over the default fullSpec is that the three path parameters and
    # configurationRef are excluded from the comparison BY CONSTRUCTION rather than by the
    # accident of GitHub not happening to return keys with those names. `environment_name` in
    # particular is one rename away from colliding with the response's `name`.
    #
    # wait_timer, prevent_self_review and reviewers are in the updatable set AND now observed:
    # GitHub returns them only nested in the anyOf-typed `protection_rules` array (never as
    # top-level keys), and the get verb's responseTransform below flattens that array back into
    # the top-level PUT shape before status population and the drift comparison. So an out-of-band
    # UI edit to any of the three is now seen and reverted, exactly like deployment_branch_policy
    # (which GitHub already returns top-level). This is the same GET/PUT shape asymmetry
    # BranchProtection closes with a responseTransform. See assets/environment.yaml for the shape.
    configurationFields: []
    verbsDescription:
      # PUT is create-or-update upstream, so create and update are the same endpoint. Observe
      # decides which one runs: GET 404 -> create, GET 200 + drift -> update.
      - action: create
        method: PUT
        path: /repos/{owner}/{repo}/environments/{environment_name}
      - action: get
        method: GET
        path: /repos/{owner}/{repo}/environments/{environment_name}
        # GitHub returns wait_timer / prevent_self_review / reviewers ONLY nested inside the
        # anyOf-typed `protection_rules` array, never as top-level keys, while the PUT sets them at
        # top level — the same GET/PUT shape asymmetry BranchProtection has. oasgen cannot model an
        # anyOf array, so this whole-document responseTransform flattens protection_rules back into
        # the PUT shape at the reconcile chokepoint (the observe GET feeds BOTH status population and
        # the drift comparison). Everything else — id, node_id, name, url, html_url, created_at,
        # updated_at, deployment_branch_policy — is passed through unchanged so the identifier and
        # the additionalStatusFields survive. protection_rules itself is dropped from the output.
        #
        #   protection_rules[type=wait_timer].wait_timer                      -> wait_timer (int)
        #   protection_rules[type=required_reviewers].prevent_self_review     -> prevent_self_review (bool)
        #   protection_rules[type=required_reviewers].reviewers[]
        #     {type, reviewer:{id}}                                           -> reviewers: [{type, id}]
        #   (a branch_policy rule carries nothing the CR sets and is ignored)
        #
        # ABSENT-rule defaults make a CR CONVERGE. VERIFIED LIVE 2026-11-03: GitHub's PUT is a MERGE
        # for protection rules — OMITTING a key keeps the current value — and an EXPLICIT wait_timer:0
        # REMOVES the wait_timer rule while reviewers:[] REMOVES the required_reviewers rule. So the
        # transform normalizes an absent wait_timer rule to 0 and an absent required_reviewers rule to
        # reviewers:[] + prevent_self_review:false, which is exactly the state an explicit 0 / [] / false
        # produces -> those CRs converge. A CR that OMITS a key never sends it (RDC assembles the body
        # from spec keys; there is no requestTransform here) and never compares it, so the UI value is
        # left untouched -- Environment does NOT silently overwrite. `//` defaults RAW extractions only,
        # never a normalized value. reviewers is sorted by (type,id) because array comparison is
        # positional -- the asset tells authors to write it sorted.
        #
        # ONE non-convergent case, by GitHub's design (not a transform defect): prevent_self_review is
        # carried INSIDE the required_reviewers rule, so prevent_self_review:true with an empty/absent
        # reviewers list creates NO rule -- GitHub stores nothing, the transform returns false, and such
        # a CR re-PUTs forever (idempotent, never converges). It cannot be rejected at admission until
        # oasgen passes cross-field validation through (oasgen-provider#396, the same blocker as the
        # BranchProtection checks form). The asset tells authors to set prevent_self_review only with a
        # non-empty reviewers list.
        responseTransform:
          inline: |
            {
              id: .id,
              node_id: .node_id,
              name: .name,
              url: .url,
              html_url: .html_url,
              created_at: .created_at,
              updated_at: .updated_at,
              deployment_branch_policy: .deployment_branch_policy,
              wait_timer: (([ (.protection_rules // [])[] | select(.type == "wait_timer") | .wait_timer ])[0] // 0),
              prevent_self_review: (([ (.protection_rules // [])[] | select(.type == "required_reviewers") | .prevent_self_review ])[0] // false),
              reviewers: ([ (.protection_rules // [])[] | select(.type == "required_reviewers") | (.reviewers // [])[] | {type: .type, id: .reviewer.id} ] | sort_by(.type, .id))
            }
      - action: update
        method: PUT
        path: /repos/{owner}/{repo}/environments/{environment_name}
      - action: delete
        method: DELETE
        path: /repos/{owner}/{repo}/environments/{environment_name}
