{{- if include "github-provider-kog.kindEnabled" (list . "Issue") -}}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-issue
  namespace: {{ .Release.Namespace }}
spec:
  {{- include "github-provider-kog.serverURL" . | nindent 2 }}
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-issue/issue.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: Issue
    # `number` is the issue's identity (titles are not unique) and a property of the GET
    # response, so status populates and the item path can be keyed off it.
    identifiers:
      - number
    additionalStatusFields:
      - number
      - id
      - node_id
      - html_url
      - state
      - comments
    # issue_number is a path parameter on get/update only. oasgen merges parameters from every verb
    # into the spec, but omits one that a mapping supplies, and the requestFieldMapping below
    # supplies this one, so it is not a spec field. The excludedSpecFields entry below is a
    # redundant no-op (oasgen warns it is not in the schema), kept because excludedSpecFields is
    # oasgen-immutable (#290) and it records the intent that the number is never author-supplied;
    # get/update source the path parameter from status.number via the requestFieldMapping below.
    # Same shape as PullRequest's pull_number.
    excludedSpecFields:
      - issue_number
    # `updatable` compares title and body: the PATCH body's fields that are also spec fields.
    # The PATCH body also carries state and state_reason, but oasgen builds the spec body from the
    # create verb alone, so those two are not spec fields and are never compared or sent
    # (oasgen-provider#491 asks for update-only spec fields).
    #
    # `fullSpec` would be actively wrong here. It compares the whole spec against the observed
    # body, and while spec keys the response omits are simply skipped, `labels`, `assignees` and
    # `milestone` are NOT omitted — GitHub returns all three, as objects, where the request takes
    # strings and an integer (see assets/issue.yaml). They would therefore be compared and always
    # differ: drift on every reconcile, a PATCH that cannot fix it, forever, against a
    # 5000 req/hr budget. `identifiersAndStatus` would avoid that too, but it would also stop
    # comparing title and body — and those ARE fixable, so it would silently drop the one thing
    # this kind can do after create: re-titling and re-wording an issue from the CR.
    compareScope: updatable
    configurationFields: []
    #
    # NO DELETE VERB — the same shape PullRequest ships with, and for the same reason: GitHub's
    # REST API has no endpoint that deletes an issue (only the GraphQL deleteIssue mutation,
    # which needs admin rights and is not reachable from a RestDefinition). Nothing is being
    # papered over: there is no 204-returning or otherwise substitutable endpoint to map.
    #
    # So deleting the CR only stops Krateo managing the issue; the issue stays where it is on
    # GitHub. It cannot be CLOSED from the CR either (state is not a spec field, see above):
    # close it on GitHub, then delete the CR if you no longer want it tracked.
    verbsDescription:
      - action: create
        method: POST
        path: /repos/{owner}/{repo}/issues
      - action: get
        method: GET
        path: /repos/{owner}/{repo}/issues/{issue_number}
        requestFieldMapping:
          - inPath: issue_number
            inCustomResource: status.number
      - action: update
        method: PATCH
        path: /repos/{owner}/{repo}/issues/{issue_number}
        requestFieldMapping:
          - inPath: issue_number
            inCustomResource: status.number
{{- end }}
