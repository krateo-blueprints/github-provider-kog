{{- if include "github-provider-kog.kindEnabled" (list . "AutomatedSecurityFixes") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-automatedsecurityfixes
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, unlike configmap-repocontent / configmap-gitref / configmap-pullrequest.
  # Those three carry a per-operation `servers` override pointing at the plugin, so their asset has
  # to resolve a template. AutomatedSecurityFixes is fully native — every verb goes straight to
  # api.github.com — so the asset is copied verbatim and contains no template action.
  automatedsecurityfixes.yaml: |
{{ .Files.Get "assets/automatedsecurityfixes.yaml" | indent 4 }}
{{- end }}
