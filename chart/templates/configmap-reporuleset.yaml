{{- if include "github-provider-kog.kindEnabled" (list . "RepoRuleset") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-reporuleset
  namespace: {{ .Release.Namespace }}
data:
  # NOT tpl-rendered, unlike configmap-repocontent / configmap-gitref / configmap-pullrequest.
  # Those three carry a per-operation `servers` override pointing at the plugin, so their asset
  # has to resolve a template. This kind is fully native — every verb goes straight to
  # api.github.com — so the asset is copied verbatim and contains no template action.
  reporuleset.yaml: |
{{ .Files.Get "assets/reporuleset.yaml" | indent 4 }}
{{- end }}
