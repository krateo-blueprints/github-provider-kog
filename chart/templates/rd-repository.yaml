apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-repository
  namespace: {{ .Release.Namespace }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-repository/repository.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: Repository
    # The repo name distinguishes the resource; `org` scopes it (and is a path param on every
    # verb), which is the same split RepoContent uses with `path` against owner/repo.
    identifiers:
      - name
    additionalStatusFields:
      - id
      - node_id
      - full_name
      - html_url
      - clone_url
      - ssh_url
      - default_branch
    # Compare only what the PATCH body can express.
    #
    # NOTE, because an earlier version of this comment said the opposite and the wrong reasoning
    # was copied into several other kinds: the three create-only fields (auto_init,
    # gitignore_template, license_template) do NOT cause a drift loop under the default fullSpec.
    # GitHub never echoes them on GET, and the comparison SKIPS any spec key the response does not
    # carry — `rmValue, ok := rm[key]; if !ok { continue }` in the controller's comparison
    # (rest-dynamic-controller, internal/tools/comparison). An absent key contributes nothing.
    #
    # What DOES loop is a spec key the response DOES carry, in a different shape or a
    # server-normalised value, that the update verb cannot fix — a spec string against a response
    # object, or a timestamp the server re-writes. That is the case `updatable` exists for, and it
    # is why several other kinds here genuinely need it (TeamRepo's owner, Issue's labels,
    # Milestone's due_on, Collaborator's effective role).
    #
    # For Repository, `updatable` is LOAD-BEARING. DO NOT set it to fullSpec, and do not delete the
    # line — the DEFAULT is fullSpec, so removing it is the same mistake. This comment used to say
    # the opposite, correctly, until #11.
    #
    # `private` and `visibility` are create-body fields that the PATCH body deliberately OMITS (see
    # assets/repository.yaml for the full why). GitHub echoes both on every GET, so under fullSpec
    # they would be compared again — and a consumer changing its rendered value would then flip the
    # exposure of repositories that ALREADY EXIST, which forks, clones, caches and search indexing
    # make irreversible. Nothing else encodes that guarantee: not the CRD, not a validation, not an
    # error. The absence in the PATCH body plus this one word are the whole of it, which is why
    # hack/assert-drift-invariants.py asserts both.
    #
    # It requires an update verb, which this resource has, and oasgen-provider >= 0.23.0.
    compareScope: updatable
    configurationFields: []
    verbsDescription:
      - action: create
        method: POST
        path: /orgs/{org}/repos
      # GET/UPDATE key the repo on the name GitHub ACTUALLY assigned (status.name), not on
      # spec.name — the Team model (rd-team.yaml, team_slug <- status.slug). This is the #386 fix.
      #
      # GitHub normalises a disallowed character in a repo name on create: POST body name="my repo"
      # creates the repo "my-repo", and status.name (the `name` identifier, populated from the
      # create response) is "my-repo". WITHOUT this mapping the observe GET is built from spec.name
      # "my repo" and 404s while the repo exists, so the controller re-creates, GitHub answers 422
      # "name already exists", and the reconcile loops forever (oasgen-provider #386).
      #
      # The mapping runs LAST in BuildCallConfig and OVERWRITES the path parameter, but only when
      # its source is present (builder.go applyFieldMapping: a missing source skips, no error):
      #   - pre-create, status.name is absent, so `name` falls back to spec.name and the GET 404s
      #     because the repo genuinely does not exist yet -> one create, then status.name is set;
      #   - thereafter the GET/PATCH address status.name (the real name) -> 200, no re-create.
      # It also makes an out-of-band rename converge: the redirect-following GET (#132) reports the
      # new name, status.name tracks it, and the next observe addresses it directly — and because
      # `name` is deliberately OUT of the PATCH body (see assets/repository.yaml), it is NOT in the
      # `updatable` compare set, so tracking the real name never triggers a rename-back PATCH loop.
      - action: get
        method: GET
        path: /repos/{org}/{name}
        fieldMapping:
          - inPath: name
            inCustomResource: status.name
      - action: update
        method: PATCH
        path: /repos/{org}/{name}
        fieldMapping:
          - inPath: name
            inCustomResource: status.name
    # NO DELETE VERB, DELIBERATELY. Deleting this CR ORPHANS the GitHub repository; it does not
    # destroy it. rest-dynamic-controller handles an absent delete verb by releasing the finalizer
    # and leaving the external resource alone (restResources.go Delete: `apiCall == nil` -> log
    # "API action delete not found" -> return nil), so nothing wedges.
    #
    # WHY, and it is not squeamishness. oasgen-provider deletes a RestDefinition's CRD
    # UNCONDITIONALLY (SkipCRD:false), which cascade-deletes every CR of that kind, which runs every
    # finalizer. With a delete verb here, that chain ends in DELETE /repos/{org}/{name} — so
    # removing this RestDefinition, uninstalling the chart, or any CRD-version migration would
    # DESTROY EVERY REPOSITORY IT EVER CREATED, including the code in them. That is oasgen-provider
    # #125, found on krateo-057 where a duplicate install could not be hand-cleaned for exactly this
    # reason. Until the upstream guard lands, not having the verb is the only thing that makes the
    # cascade harmless.
    #
    # The trade is deliberate and one-directional: a leaked repository is an inconvenience someone
    # can delete in GitHub; a destroyed one is not recoverable from here. For a blueprint
    # DESTINATION repo, "removing the CR should never remove the code" is the right default. Restore
    # the verb only alongside the #125 guard, and only with a per-CR opt-in.
