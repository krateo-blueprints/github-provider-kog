apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-repository
  namespace: {{ .Release.Namespace }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-repository/repository.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: Repository
    # The repo name distinguishes the resource; `org` scopes it (and is a path param on every
    # verb), which is the same split RepoContent uses with `path` against owner/repo.
    identifiers:
      - name
    additionalStatusFields:
      - id
      - node_id
      - full_name
      - html_url
      - clone_url
      - ssh_url
      - default_branch
    # DELIBERATE, and the one non-obvious choice in this file.
    #
    # Under the default `fullSpec`, Observe compares EVERY spec field against the GET response.
    # Three fields in the create body — auto_init, gitignore_template, license_template — are
    # create-only: GitHub accepts them on POST and never echoes them back on GET. Under fullSpec
    # they read as permanent drift, and the controller would PATCH the repository on every single
    # reconcile, forever, against an API with a 5000 req/hr budget.
    #
    # `updatable` compares exactly the fields the PATCH body can express, derived from the OAS.
    # That is the right set here: the three create-only fields drop out (the controller could not
    # fix them anyway, so comparing them can only produce an update that changes nothing), while
    # description, homepage, private, visibility, has_issues, has_wiki, has_projects,
    # default_branch and archived stay compared and stay fixable.
    #
    # This was `identifiersAndStatus` when first written, because `updatable` did not exist below
    # oasgen-provider 0.23.0. That older setting compared only `name` plus the status fields, so
    # editing `description` or `private` on an existing CR was silently never pushed. `updatable`
    # removes that gap without reintroducing the create-only drift loop, so it strictly replaces
    # it. It requires an update verb, which this resource has.
    compareScope: updatable
    configurationFields: []
    verbsDescription:
      - action: create
        method: POST
        path: /orgs/{org}/repos
      - action: get
        method: GET
        path: /repos/{org}/{name}
      - action: update
        method: PATCH
        path: /repos/{org}/{name}
      - action: delete
        method: DELETE
        path: /repos/{org}/{name}
