# Default values for github-provider-kog.
#
# This chart ships RestDefinitions (ogen.krateo.io/v1alpha1) + the trimmed OpenAPI
# specs they reference (as ConfigMaps). oasgen-provider (installed cluster-wide)
# watches the RestDefinitions, generates the CRDs under `resourceGroup`, and
# auto-deploys a rest-dynamic-controller Deployment per kind. There is NO provider
# image in this chart.
#
# When installed as a Krateo component, the CDC generates this chart's CRD from
# values.schema.json, so keep values flat: a scalar or a list default materializes
# cleanly in the component CR; nested-object toggles would not.

# The API group every generated CRD lands under: each resource kind plus a
# <Kind>Configuration auth kind for it.
resourceGroup: github.krateo.io

# Which kinds to render, by Kind name. Empty renders all 32. Each RestDefinition runs one
# rest-dynamic-controller pod, whether or not a CR of its kind exists, so this is what sets the
# provider's pod count. A child Krateo that only publishes through the builders needs:
#   kinds: [Repository, PullRequest]
# Before removing a kind from a running install, delete its CRs. See docs/configuration.md.
kinds: []
