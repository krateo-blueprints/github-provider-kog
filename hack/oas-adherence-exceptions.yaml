# Every place a kind's requests differ from GitHub's OpenAPI description, and why.
# Checked by hack/assert-oas-adherence.py: a difference with no entry fails CI, and so does an
# entry that no longer matches a difference (restoring a field means deleting its entry here).
#
# category  A safety: restoring it would let drift damage live objects
#           B drift: GitHub does not echo it as sent, so a compared field would PATCH forever
#           C modelling: a deliberate shape choice (renamed parameter, flattened union, ...)
#           D unmodelled: no reason found; `restore` says where it is being restored, or why it is held
# row       the deviation review (2026-11-10) row; "new" = found by this check's nested comparison
#
# defaults: the asset `default`s, frozen (Diego, 2026-11-10). A CRD default is materialized into
# every existing CR and cannot be withdrawn (oasgen-provider#562), so new fields never copy one.
# `github` is GitHub's own schema default (null = none declared); the check verifies both values.
github_oas_commit: fa8d7bfb041cc9ef90ac51dcb8ed8cc8a0007166
